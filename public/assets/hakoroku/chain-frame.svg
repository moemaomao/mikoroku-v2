<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 700"
     preserveAspectRatio="none">

  <defs>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="20%" stop-color="#cfcfcf"/>
      <stop offset="50%" stop-color="#7f7f7f"/>
      <stop offset="80%" stop-color="#dcdcdc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2"
                    flood-color="#000"
                    flood-opacity="0.35"/>
    </filter>

  </defs>

  <!-- ================= TOP ================= -->

  <g filter="url(#shadow)">
    <ellipse cx="60"  cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="120" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="180" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="240" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="300" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="360" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="420" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="480" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="540" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="600" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="660" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="720" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="780" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="840" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="900" cy="35" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
  </g>

  <!-- ================= BOTTOM ================= -->

  <g filter="url(#shadow)">
    <ellipse cx="60"  cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="120" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="180" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="240" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="300" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="360" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="420" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="480" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="540" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="600" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="660" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="720" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="780" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="840" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="900" cy="665" rx="28" ry="16" fill="none" stroke="url(#metal)" stroke-width="8"/>
  </g>

  <!-- ================= LEFT ================= -->

  <g filter="url(#shadow)">
    <ellipse cx="35" cy="90"  rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="150" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="210" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="270" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="330" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="390" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="450" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="510" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="35" cy="570" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
  </g>

  <!-- ================= RIGHT ================= -->

  <g filter="url(#shadow)">
    <ellipse cx="965" cy="90"  rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="150" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="210" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="270" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="330" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="390" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="450" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="510" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <ellipse cx="965" cy="570" rx="16" ry="28" fill="none" stroke="url(#metal)" stroke-width="8"/>
  </g>

  <!-- ================= CORNERS ================= -->

  <g filter="url(#shadow)">
    <circle cx="35" cy="35" r="18"
            fill="none"
            stroke="url(#metal)"
            stroke-width="8"/>

    <circle cx="965" cy="35" r="18"
            fill="none"
            stroke="url(#metal)"
            stroke-width="8"/>

    <circle cx="35" cy="665" r="18"
            fill="none"
            stroke="url(#metal)"
            stroke-width="8"/>

    <circle cx="965" cy="665" r="18"
            fill="none"
            stroke="url(#metal)"
            stroke-width="8"/>
