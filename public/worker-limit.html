<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="2;url=/">
    <title>Mikoroku sedang memulihkan halaman</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0b0b0b;
        color: #f4f4f5;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #fb7185;
      }
    </style>
    <script>
      window.setTimeout(() => window.location.replace("/"), 500);
    </script>
  </head>
  <body>
    <main>
      <h1>Halaman sedang dipulihkan</h1>
      <p>Kami mengarahkan Anda kembali ke Mikoroku.</p>
      <p><a href="/">Klik di sini jika tidak dialihkan otomatis.</a></p>
    </main>
  </body>
</html>
