<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mikoroku — OG cepat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaf0;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --ok: #3dd68c;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 20px; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; }
    input {
      width: 100%;
      background: #12151e;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 11px 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .primary { background: var(--accent); color: #fff; }
    .secondary { background: #2a2f3d; color: var(--text); }
    .sync { background: #0d9488; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.45; }
    .preview { display: flex; gap: 12px; align-items: center; }
    .preview img {
      width: 96px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #000;
      object-fit: cover;
    }
    .meta { font-size: 0.85rem; line-height: 1.4; }
    .meta strong { display: block; margin-bottom: 4px; }
    .src { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .out {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      word-break: break-all;
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 44px;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OG cepat</h1>
    <p class="sub">
      Cover diambil prioritas dari <b>Firestore (admin)</b>, baru catalog/GitHub.
      Tempel URL series saja.
    </p>

    <div class="card">
      <label>URL series</label>
      <input id="series" placeholder="https://mikoroku.top/series/nama-slug" value="" autofocus />

      <div class="actions">
        <button class="primary" id="btnFetch">1. Ambil data</button>
        <button class="sync" id="btnSync" disabled>2. Sync ke KV</button>
        <button class="secondary" id="btnOpen" disabled>3. Buka OG</button>
        <button class="secondary" id="btnCopy" disabled>Salin URL</button>
      </div>
      <p class="hint">
        Sumber cover: Firestore admin → catalog → halaman series.
        Override hanya jika deteksi masih salah.
      </p>

      <label style="margin-top:14px">Cover override (opsional)</label>
      <input id="coverOverride" placeholder="kosongkan = otomatis" value="" />
    </div>

    <div class="card">
      <div class="preview">
        <img id="img" alt="" src="" hidden />
        <div class="meta">
          <strong id="titleView">—</strong>
          <div id="status" class="muted">Tempel URL lalu klik Ambil data.</div>
          <div id="srcView" class="src"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <label>URL OG</label>
      <div class="out" id="out">—</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const FS =
      "https://firestore.googleapis.com/v1/projects/mikoroku/databases/(default)/documents";
    let last = null;

    function parseSlug(input) {
      const raw = (input || "").trim();
      if (!raw) return "";
      try {
        if (/^https?:\/\//i.test(raw)) {
          const u = new URL(raw);
          const m = u.pathname.match(/\/(?:series|manga)\/([^/]+)/i);
          if (m) return decodeURIComponent(m[1]);
          const parts = u.pathname.split("/").filter(Boolean);
          return decodeURIComponent(parts[parts.length - 1] || "");
        }
      } catch {}
      return raw.replace(/^\/+|\/+$/g, "");
    }

    function titleFromSlug(slug) {
      return decodeURIComponent(slug)
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function isHttp(u) {
      return typeof u === "string" && /^https?:\/\//i.test(u.trim());
    }

    function decodeFsValue(value) {
      if (!value || typeof value !== "object") return value;
      if ("stringValue" in value) return value.stringValue;
      if ("integerValue" in value) return Number(value.integerValue);
      if ("doubleValue" in value) return Number(value.doubleValue);
      if ("booleanValue" in value) return value.booleanValue;
      if ("nullValue" in value) return null;
      if ("arrayValue" in value) {
        return (value.arrayValue.values || []).map(decodeFsValue);
      }
      if ("mapValue" in value) {
        const fields = value.mapValue.fields || {};
        return Object.fromEntries(
          Object.entries(fields).map(([k, v]) => [k, decodeFsValue(v)]),
        );
      }
      return value;
    }

    function decodeFsDoc(doc) {
      const fields = doc?.fields || {};
      return Object.fromEntries(
        Object.entries(fields).map(([k, v]) => [k, decodeFsValue(v)]),
      );
    }

    function pickCover(item) {
      if (!item || typeof item !== "object") return "";
      for (const k of ["cover", "img", "image", "thumbnail", "thumb"]) {
        if (isHttp(item[k])) return String(item[k]).trim();
      }
      if (Array.isArray(item.covers)) {
        // admin often puts latest cover last or first — prefer last non-empty http
        for (let i = item.covers.length - 1; i >= 0; i--) {
          if (isHttp(item.covers[i])) return String(item.covers[i]).trim();
        }
      }
      return "";
    }

    function stripHtml(s) {
      return String(s || "")
        .replace(/<[^>]+>/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function slugKey(s) {
      return String(s || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    /** 1) Admin data — prioritas tertinggi */
    async function fetchFromFirestore(slug) {
      const res = await fetch(
        FS + "/manga/" + encodeURIComponent(slug),
        { headers: { Accept: "application/json" } },
      );
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("Firestore HTTP " + res.status);
      const data = decodeFsDoc(await res.json());
      const title = String(data.title || data.name || "").trim();
      const cover = pickCover(data);
      const description = stripHtml(
        data.desc || data.description || data.synopsis || data.sinopsis || "",
      ).slice(0, 300);
      if (!title && !cover) return null;
      return {
        title: title || titleFromSlug(slug),
        cover,
        description,
        source: "firestore (admin)",
      };
    }

    /** 2) Catalog / GitHub — sering cover lama */
    async function fetchFromCatalog(slug) {
      const res = await fetch("/api/catalog/manga", { credentials: "omit" });
      if (!res.ok) throw new Error("catalog HTTP " + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : data?.data;
      if (!Array.isArray(list)) return null;

      const sk = slugKey(slug);
      const hit =
        list.find((x) => slugKey(x?.slug) === sk) ||
        list.find((x) => slugKey(x?.title) === sk);
      if (!hit) return null;

      return {
        title: String(hit.title || hit.name || titleFromSlug(slug)).trim(),
        cover: pickCover(hit),
        description: stripHtml(
          hit.desc || hit.description || hit.synopsis || hit.sinopsis || "",
        ).slice(0, 300),
        source: "catalog (github)",
      };
    }

    async function fetchFromSeriesPage(slug) {
      const res = await fetch("/series/" + encodeURIComponent(slug), {
        credentials: "omit",
        headers: { Accept: "text/html" },
      });
      if (!res.ok) throw new Error("series page HTTP " + res.status);
      const html = await res.text();

      const ogImage =
        html.match(/property=["']og:image["']\s+content=["']([^"']+)["']/i) ||
        html.match(/content=["']([^"']+)["']\s+property=["']og:image["']/i);
      const ogTitle =
        html.match(/property=["']og:title["']\s+content=["']([^"']+)["']/i) ||
        html.match(/content=["']([^"']+)["']\s+property=["']og:title["']/i);
      const ogDesc =
        html.match(/property=["']og:description["']\s+content=["']([^"']+)["']/i) ||
        html.match(/content=["']([^"']+)["']\s+property=["']og:description["']/i);

      let cover = ogImage?.[1] || "";
      if (cover.includes("/og/series/")) cover = "";

      // prefer ibb from page HTML (admin cover) over random blogger
      const ibb = html.match(/https?:\/\/i\.ibb\.co\/[^"'\s>]+/i);
      if (ibb) cover = ibb[0];

      let title = (ogTitle?.[1] || "").replace(/\s*[-|]\s*Mikoroku\s*$/i, "").trim();

      return {
        title: title || titleFromSlug(slug),
        cover,
        description: (ogDesc?.[1] || "").slice(0, 300),
        source: "series page",
      };
    }

    async function resolveSeries(seriesInput) {
      const slug = parseSlug(seriesInput);
      if (!slug) throw new Error("URL series tidak valid");

      let title = titleFromSlug(slug);
      let cover = "";
      let description = "";
      let source = "";

      // 1) Firestore admin (cover terbaru)
      try {
        const fs = await fetchFromFirestore(slug);
        if (fs) {
          title = fs.title || title;
          if (fs.cover) {
            cover = fs.cover;
            source = fs.source;
          }
          description = fs.description || description;
        }
      } catch (e) {
        console.warn("firestore", e);
      }

      // 2) catalog hanya jika cover masih kosong
      if (!cover) {
        try {
          const cat = await fetchFromCatalog(slug);
          if (cat) {
            title = title || cat.title;
            if (cat.cover) {
              cover = cat.cover;
              source = cat.source;
            }
            description = description || cat.description;
          }
        } catch (e) {
          console.warn("catalog", e);
        }
      }

      // 3) halaman series
      if (!cover) {
        try {
          const page = await fetchFromSeriesPage(slug);
          title = title || page.title;
          if (page.cover) {
            cover = page.cover;
            source = page.source;
          }
          description = description || page.description;
        } catch (e) {
          console.warn("page", e);
        }
      }

      const override = $("coverOverride").value.trim();
      if (override && isHttp(override)) {
        cover = override;
        source = "override manual";
      }

      if (!cover) throw new Error("Cover tidak ketemu. Isi Cover override.");

      return {
        slug,
        title,
        cover,
        description: description || ("Baca " + title + " di Mikoroku."),
        updatedAt: Date.now(),
        source,
      };
    }

    function buildOgUrl(data) {
      const q = new URLSearchParams();
      q.set("v", String(data.updatedAt || Date.now()));
      q.set("title", data.title.slice(0, 72));
      q.set("description", data.description.slice(0, 120));
      q.set("cover", data.cover);
      return (
        "https://mikoroku.top/og/series/" +
        encodeURIComponent(data.slug) +
        "?" +
        q.toString()
      );
    }

    function setActions(on) {
      $("btnSync").disabled = !on;
      $("btnOpen").disabled = !on;
      $("btnCopy").disabled = !on;
    }

    function show(data) {
      last = data;
      $("img").hidden = false;
      $("img").src = data.cover;
      $("titleView").textContent = data.title;
      $("srcView").textContent = "Sumber cover: " + (data.source || "—");
      $("out").textContent = buildOgUrl(data);
      setActions(true);
    }

    $("btnFetch").onclick = async () => {
      $("btnFetch").disabled = true;
      $("status").innerHTML = '<span class="muted">Mengambil data (Firestore dulu)…</span>';
      try {
        const data = await resolveSeries($("series").value);
        show(data);
        $("status").innerHTML =
          '<span class="ok">Cover ketemu. Lanjut Sync / Buka OG.</span>';
      } catch (e) {
        setActions(false);
        $("status").innerHTML = '<span class="err">' + (e.message || e) + "</span>";
      } finally {
        $("btnFetch").disabled = false;
      }
    };

    $("btnSync").onclick = async () => {
      if (!last) return;
      $("btnSync").disabled = true;
      $("status").innerHTML = '<span class="muted">Sync ke KV…</span>';
      try {
        const res = await fetch("/api/admin/sync-cover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            slug: last.slug,
            title: last.title,
            cover: last.cover,
            description: last.description,
            updatedAt: last.updatedAt,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("status").innerHTML =
            '<span class="err">Sync gagal: ' +
            (data.detail || data.error || res.status) +
            " — tetap bisa Buka OG</span>";
          return;
        }
        try {
          await fetch("/api/admin/purge-og", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              slug: last.slug,
              versions: [last.updatedAt, 0],
            }),
          });
        } catch {}
        $("status").innerHTML = '<span class="ok">KV OK. Klik Buka OG.</span>';
        if (data.ogUrl) $("out").textContent = data.ogUrl;
      } catch (e) {
        $("status").innerHTML = '<span class="err">' + (e.message || e) + "</span>";
      } finally {
        $("btnSync").disabled = false;
      }
    };

    $("btnOpen").onclick = () => {
      if (!last) return;
      const url = buildOgUrl(last);
      $("out").textContent = url;
      window.open(url, "_blank", "noopener");
    };

    $("btnCopy").onclick = async () => {
      if (!last) return;
      const url = buildOgUrl(last);
      $("out").textContent = url;
      try {
        await navigator.clipboard.writeText(url);
        $("status").innerHTML = '<span class="ok">URL disalin.</span>';
      } catch {
        $("status").innerHTML = '<span class="err">Gagal salin.</span>';
      }
    };

    $("series").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnFetch").click();
    });
  </script>
</body>
</html>
