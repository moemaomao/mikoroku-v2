<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mikoroku — OG cepat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaf0;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --ok: #3dd68c;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 20px; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; }
    input {
      width: 100%;
      background: #12151e;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 11px 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .primary { background: var(--accent); color: #fff; }
    .secondary { background: #2a2f3d; color: var(--text); }
    .sync { background: #0d9488; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.45; }
    .preview { display: flex; gap: 12px; align-items: center; }
    .preview img {
      width: 96px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #000;
      object-fit: cover;
    }
    .meta { font-size: 0.85rem; line-height: 1.4; }
    .meta strong { display: block; margin-bottom: 4px; }
    .src { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .out {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      word-break: break-all;
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 44px;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .muted { color: var(--muted); }
  </style>
  <!-- Firebase client SDK (sama config app) — hindari REST 429 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAi8z8oGGNJSNe87UVWh3FagJZSy_uhuoI",
      authDomain: "mikoroku.firebaseapp.com",
      projectId: "mikoroku",
      storageBucket: "mikoroku.firebasestorage.app",
      messagingSenderId: "271920446600",
      appId: "1:271920446600:web:974b11c707ebc11a7bf33d",
    };

    const app = initializeApp(firebaseConfig, "mikoroku-og-tool");
    const db = getFirestore(app);

    window.__mikorokuFs = {
      async getManga(slug) {
        const snap = await getDoc(doc(db, "manga", slug));
        if (!snap.exists()) return null;
        return { id: snap.id, ...snap.data() };
      },
    };
    window.dispatchEvent(new Event("mikoroku-fs-ready"));
  </script>
</head>
<body>
  <div class="wrap">
    <h1>OG cepat</h1>
    <p class="sub">
      Cover dari <b>Firestore via Firebase SDK</b> (data admin), bukan REST yang kena 429.
    </p>

    <div class="card">
      <label>URL series</label>
      <input id="series" placeholder="https://mikoroku.top/series/nama-slug" value="" autofocus />

      <div class="actions">
        <button class="primary" id="btnFetch">1. Ambil data</button>
        <button class="sync" id="btnSync" disabled>2. Sync ke KV</button>
        <button class="secondary" id="btnOpen" disabled>3. Buka OG</button>
        <button class="secondary" id="btnCopy" disabled>Salin URL</button>
      </div>
      <p class="hint">
        Jangan spam Ambil data — Firestore &amp; series page bisa limit.
        Cover override = tempel URL dari field Cover di admin.
      </p>

      <label style="margin-top:14px">Cover override (opsional)</label>
      <input id="coverOverride" placeholder="https://i.ibb.co/..." value="" />
    </div>

    <div class="card">
      <div class="preview">
        <img id="img" alt="" src="" hidden />
        <div class="meta">
          <strong id="titleView">—</strong>
          <div id="status" class="muted">Tempel URL lalu klik Ambil data.</div>
          <div id="srcView" class="src"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <label>URL OG</label>
      <div class="out" id="out">—</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let last = null;

    function parseSlug(input) {
      const raw = (input || "").trim();
      if (!raw) return "";
      try {
        if (/^https?:\/\//i.test(raw)) {
          const u = new URL(raw);
          const m = u.pathname.match(/\/(?:series|manga)\/([^/]+)/i);
          if (m) return decodeURIComponent(m[1]);
          const parts = u.pathname.split("/").filter(Boolean);
          return decodeURIComponent(parts[parts.length - 1] || "");
        }
      } catch {}
      return raw.replace(/^\/+|\/+$/g, "");
    }

    function titleFromSlug(slug) {
      return decodeURIComponent(slug)
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function isHttp(u) {
      return typeof u === "string" && /^https?:\/\//i.test(u.trim());
    }

    function preferCover(urls) {
      const list = urls.filter(isHttp).map((u) => u.trim());
      const ibb = list.find((u) => /i\.ibb\.co/i.test(u));
      if (ibb) return ibb;
      const imgbb = list.find((u) => /ibb\.co|imgbb/i.test(u));
      if (imgbb) return imgbb;
      return list[0] || "";
    }

    function pickCover(item) {
      if (!item || typeof item !== "object") return "";
      const candidates = [];
      for (const k of ["cover", "img", "image", "thumbnail", "thumb"]) {
        if (isHttp(item[k])) candidates.push(item[k]);
      }
      if (Array.isArray(item.covers)) {
        for (const c of item.covers) if (isHttp(c)) candidates.push(c);
      }
      return preferCover(candidates);
    }

    function stripHtml(s) {
      return String(s || "")
        .replace(/<[^>]+>/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function waitFs(timeoutMs = 8000) {
      if (window.__mikorokuFs) return Promise.resolve(window.__mikorokuFs);
      return new Promise((resolve, reject) => {
        const t = setTimeout(
          () => reject(new Error("Firebase SDK gagal load")),
          timeoutMs,
        );
        window.addEventListener(
          "mikoroku-fs-ready",
          () => {
            clearTimeout(t);
            resolve(window.__mikorokuFs);
          },
          { once: true },
        );
      });
    }

    async function fetchFromFirestoreSdk(slug) {
      const fs = await waitFs();
      const data = await fs.getManga(slug);
      if (!data) return null;
      const title = String(data.title || data.name || "").trim();
      const cover = pickCover(data);
      const description = stripHtml(
        data.desc || data.description || data.synopsis || data.sinopsis || "",
      ).slice(0, 300);
      return {
        title: title || titleFromSlug(slug),
        cover,
        description,
        source: "firestore SDK (admin)",
      };
    }

    function slugKey(s) {
      return String(s || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    async function fetchFromCatalog(slug) {
      const res = await fetch("/api/catalog/manga", { credentials: "omit" });
      if (!res.ok) throw new Error("catalog HTTP " + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : data?.data;
      if (!Array.isArray(list)) return null;
      const sk = slugKey(slug);
      const hit =
        list.find((x) => slugKey(x?.slug) === sk) ||
        list.find((x) => slugKey(x?.title) === sk);
      if (!hit) return null;
      return {
        title: String(hit.title || hit.name || titleFromSlug(slug)).trim(),
        cover: pickCover(hit),
        description: stripHtml(
          hit.desc || hit.description || hit.synopsis || hit.sinopsis || "",
        ).slice(0, 300),
        source: "catalog (github)",
      };
    }

    async function resolveSeries(seriesInput) {
      const slug = parseSlug(seriesInput);
      if (!slug) throw new Error("URL series tidak valid");

      let title = titleFromSlug(slug);
      let cover = "";
      let description = "";
      let source = "";

      // 1) Firebase SDK — data admin
      try {
        const fs = await fetchFromFirestoreSdk(slug);
        if (fs) {
          title = fs.title || title;
          description = fs.description || description;
          if (fs.cover) {
            cover = fs.cover;
            source = fs.source;
          }
        }
      } catch (e) {
        console.warn("firestore sdk", e);
      }

      // 2) catalog hanya pelengkap title/desc; cover catalog hanya jika belum ada
      if (!cover || !title) {
        try {
          const cat = await fetchFromCatalog(slug);
          if (cat) {
            if (!title || title === titleFromSlug(slug)) title = cat.title || title;
            description = description || cat.description;
            if (!cover && cat.cover) {
              cover = cat.cover;
              source = cat.source;
            }
          }
        } catch (e) {
          console.warn("catalog", e);
        }
      }

      const override = $("coverOverride").value.trim();
      if (override && isHttp(override)) {
        cover = override;
        source = "override manual";
      }

      if (!cover) {
        throw new Error(
          "Cover tidak ketemu di Firestore. Buka admin → salin Cover URL ke override.",
        );
      }

      return {
        slug,
        title,
        cover,
        description: description || ("Baca " + title + " di Mikoroku."),
        updatedAt: Date.now(),
        source,
      };
    }

    function buildOgUrl(data) {
      const q = new URLSearchParams();
      q.set("v", String(data.updatedAt || Date.now()));
      q.set("title", data.title.slice(0, 72));
      q.set("description", data.description.slice(0, 120));
      q.set("cover", data.cover);
      return (
        "https://mikoroku.top/og/series/" +
        encodeURIComponent(data.slug) +
        "?" +
        q.toString()
      );
    }

    function setActions(on) {
      $("btnSync").disabled = !on;
      $("btnOpen").disabled = !on;
      $("btnCopy").disabled = !on;
    }

    function show(data) {
      last = data;
      $("img").hidden = false;
      $("img").src = data.cover;
      $("titleView").textContent = data.title;
      $("srcView").textContent = "Sumber cover: " + (data.source || "—");
      $("out").textContent = buildOgUrl(data);
      setActions(true);
    }

    $("btnFetch").onclick = async () => {
      $("btnFetch").disabled = true;
      $("status").innerHTML = '<span class="muted">Ambil dari Firestore…</span>';
      try {
        const data = await resolveSeries($("series").value);
        show(data);
        $("status").innerHTML =
          '<span class="ok">Cover ketemu. Lanjut Sync / Buka OG.</span>';
      } catch (e) {
        setActions(false);
        $("status").innerHTML = '<span class="err">' + (e.message || e) + "</span>";
      } finally {
        $("btnFetch").disabled = false;
      }
    };

    $("btnSync").onclick = async () => {
      if (!last) return;
      $("btnSync").disabled = true;
      $("status").innerHTML = '<span class="muted">Sync ke KV…</span>';
      try {
        const res = await fetch("/api/admin/sync-cover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            slug: last.slug,
            title: last.title,
            cover: last.cover,
            description: last.description,
            updatedAt: last.updatedAt,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("status").innerHTML =
            '<span class="err">Sync gagal: ' +
            (data.detail || data.error || res.status) +
            " — tetap bisa Buka OG</span>";
          return;
        }
        try {
          await fetch("/api/admin/purge-og", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              slug: last.slug,
              versions: [last.updatedAt, 0],
            }),
          });
        } catch {}
        $("status").innerHTML = '<span class="ok">KV OK.</span>';
        if (data.ogUrl) $("out").textContent = data.ogUrl;
      } catch (e) {
        $("status").innerHTML = '<span class="err">' + (e.message || e) + "</span>";
      } finally {
        $("btnSync").disabled = false;
      }
    };

    $("btnOpen").onclick = () => {
      if (!last) return;
      const url = buildOgUrl(last);
      $("out").textContent = url;
      window.open(url, "_blank", "noopener");
    };

    $("btnCopy").onclick = async () => {
      if (!last) return;
      const url = buildOgUrl(last);
      $("out").textContent = url;
      try {
        await navigator.clipboard.writeText(url);
        $("status").innerHTML = '<span class="ok">URL disalin.</span>';
      } catch {
        $("status").innerHTML = '<span class="err">Gagal salin.</span>';
      }
    };

    $("series").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnFetch").click();
    });
  </script>
</body>
</html>
