      <feColorMatrix in="blur"
        values="1 0 0 0 0

<style>
.reaction{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin:25px 0;
  text-align:center;
}
.reaction button{
  width:45px;
  height:45px;
  border:none;
  background:none;
  cursor:pointer;
  position:relative;
  padding:0;
}
.reaction svg {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 2;
}
.reaction span.count{
  position:absolute;
  top:-8px;
  right:-10px;
  background:#ff4081;
  color:#fff;
  font-size:12px;
  font-weight:bold;
  padding:4px 8px;
  border-radius:999px;
  min-width:22px;
  z-index:3;
}
.reaction small{
  display:block;
  margin-top:4px;
  font-size:11px;
  color:#a1a1a1;
  user-select:none;
}
.reaction button img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:0;
  position:relative;
  z-index:2;
}
/* FIRE */
.reaction button.fire::before,
.reaction button.fire::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  z-index:1;
}
.reaction button.fire::before{
  background:
    radial-gradient(circle at 50% 0%, #fff176, transparent 55%),
    radial-gradient(circle at 30% 25%, #ff5722, transparent 65%),
    radial-gradient(circle at 70% 35%, #ff9800, transparent 60%);
  filter:blur(6px);
  animation:flameMove .6s infinite alternate !important;
}
.reaction button.fire::after{
  background: radial-gradient(circle at 50% 20%, #ffeb3b, transparent 60%);
  filter:blur(10px);
  opacity:.6;
}
@keyframes flameMove{
  from{transform:translateY(0) scale(1)}
  to{transform:translateY(-4px) scale(1.08)}
}
.manga-bubble{
  position:fixed;
  background:#fff;
  color:#000;
  font-size:12px;
  padding:6px 10px;
  border-radius:12px;
  border:2px solid #000;
  white-space:nowrap;
  z-index:9999;
  pointer-events:none;
  animation:bubbleFade .6s ease forwards !important;
}
.manga-bubble::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:100%;
  width:0;
  height:0;
  border:6px solid transparent;
  border-top-color:#000;
}
.manga-bubble::before{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:calc(100% - 2px);
  width:0;
  height:0;
  border:5px solid transparent;
  border-top-color:#fff;
}
@keyframes bubbleFade{
  0%{ transform:translate(-50%,-10px) scale(.8); opacity:0; }
  100%{ transform:translate(-50%,0) scale(1); opacity:1; }
}
.manga-hide{
  animation:bubbleOut .4s ease forwards !important;
}
@keyframes bubbleOut{
  to{ transform:translate(-50%,-10px) scale(.8); opacity:0; }
}
#slime-container{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  filter:url(#goo);
}
.slime{
  position:absolute;
  background:#fff;
  border-radius:50%;
  opacity:.95;
}
.splash{ animation:splash 2.2s cubic-bezier(.2,.8,.3,1) forwards !important; }
.drip{ animation:drip 4.8s ease-in forwards !important; }
@keyframes splash{
  0%{ transform:translate(0,0) scale(.4,1.6); opacity:0; }
  20%{ opacity:1; }
  100%{ transform:translate(var(--dx),var(--up)) scale(1.4,.9); }
}
@keyframes drip{
  0%{ transform:translate(var(--dx),var(--up)) scale(1.3,1); opacity:.9; }
  100%{ transform:translate(var(--dx2),110vh) scale(.9,1.4); opacity:0; }
}
.spin-fast{ animation:spinFast 3.5s linear forwards !important; }
.spin-slow{ animation:spinSlow 1.5s cubic-bezier(.2,.8,.3,1) forwards !important; }
@keyframes spinFast{
  from{ transform:rotate(0deg) scale(1); }
  to{ transform:rotate(1440deg) scale(1.2); }
}
@keyframes spinSlow{
  0%{ transform:rotate(1440deg) scale(1.2); }
  100%{ transform:rotate(1620deg) scale(1); }
}
.fire-particle{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  background: radial-gradient(circle, #fff176, #ff9800, #ff5722);
  filter:blur(1px);
  animation:fireBurst .7s ease-out forwards !important;
}
@keyframes fireBurst{
  to{ transform:translate(var(--x),var(--y)) scale(.6); opacity:0; }
}
@keyframes angryRage {
  0%   { transform: scale(1) translate(0,0) rotate(0deg); }
  10%  { transform: scale(1.1) translate(-4px,2px) rotate(-4deg); }
  20%  { transform: scale(1.15) translate(4px,-3px) rotate(4deg); }
  30%  { transform: scale(1.25) translate(-8px,5px) rotate(-8deg); }
  32%  { transform: scale(1.28) translate(8px,-6px) rotate(8deg); }
  34%  { transform: scale(1.3) translate(-9px,6px) rotate(-9deg); }
  36%  { transform: scale(1.28) translate(9px,-6px) rotate(9deg); }
  38%  { transform: scale(1.3) translate(-10px,7px) rotate(-10deg); }
  40%  { transform: scale(1.28) translate(10px,-7px) rotate(10deg); }
  42%  { transform: scale(1.3) translate(-10px,7px) rotate(-10deg); }
  44%  { transform: scale(1.28) translate(10px,-7px) rotate(10deg); }
  46%  { transform: scale(1.3) translate(-9px,6px) rotate(-9deg); }
  48%  { transform: scale(1.28) translate(9px,-6px) rotate(9deg); }
  50%  { transform: scale(1.32) translate(-8px,5px) rotate(-8deg); filter: drop-shadow(0 0 12px red); }
  55%  { transform: scale(1.25) translate(6px,-4px) rotate(6deg); }
  60%  { transform: scale(1.22) translate(-5px,3px) rotate(-5deg); }
  70%  { transform: scale(1.15) translate(3px,-2px) rotate(3deg); }
  80%  { transform: scale(1.1) translate(-2px,1px) rotate(-2deg); }
  100% { transform: scale(1) translate(0,0) rotate(0deg); filter: drop-shadow(0 0 0 red); }
}
.angry-rage { animation: angryRage 3s linear !important; }
.reaction button img,
.reaction button svg{
  will-change: transform;
  transform-origin: center;
}
.pinball-active{ animation: pinSquash 0.2s ease !important; }
@keyframes pinSquash{
  0%{ transform:scale(1,1); }
  50%{ transform:scale(1.2,0.8); }
  100%{ transform:scale(1,1); }
}
.wall-hit{ animation: hitFlash 0.15s !important; }
@keyframes hitFlash{
  0%{ filter:brightness(1); }
  50%{ filter:brightness(2); }
  100%{ filter:brightness(1); }
}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    onSnapshot,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyAwXK4q1t_0HVA-eZN22PIlKgJ3zYXIuAs",
    projectId: "emoji-reaction-fb044"
  });

  const db = getFirestore(app);
  const auth = getAuth(app);

  enableIndexedDbPersistence(db).catch((err) => {
    if (err.code === "failed-precondition") {

      console.warn("Persistence failed: multiple tabs open");
    } else if (err.code === "unimplemented") {
      console.warn("Persistence is not available in this browser");
    }
  });

  let currentUser = null;
  const clickLock = new Map();
  const ADMIN_UID = "qcrJ0azJRvSlShzcvXv178KrmMA2";
  const isAdmin = () => currentUser && currentUser.uid === ADMIN_UID;

  onAuthStateChanged(auth, (user) => { currentUser = user; });

  let unsubscribe = null;
  let currentRef = null;
  let pageId = "";

  function getPageRef() {
    const url = new URL(location.href);
    const communityPageId = document.documentElement.dataset.communityPageId;
    const slug = url.searchParams.get("slug");
    const chapter = url.searchParams.get("chapter");
    const pageKey = communityPageId || `${slug || "global"}_${chapter || "0"}`;
    pageId = `emoji_${pageKey}`.replace(/\W/g, "_");
    return doc(db, "emoji_reactions", pageId);
  }

  async function initData(ref) {
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { like: 0, haha: 0, wow: 0, sad: 0, angry2: 0 });
    }
  }

  function startListener(targetRef) {
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }
    currentRef = targetRef;
    unsubscribe = onSnapshot(targetRef, (s) => {
      const d = s.data() || {};
      requestAnimationFrame(() => {
        document.querySelectorAll(".reaction button").forEach((b) => {
          const v = d[b.dataset.k] || 0;
          const countEl = b.querySelector(".count");
          if (countEl) countEl.textContent = v;
          b.classList.toggle("fire", v >= 10);
        });
      });
    }, (err) => console.warn("emoji listener:", err));
  }

  // First load
  const firstRef = getPageRef();
  startListener(firstRef);
  initData(firstRef).catch(console.error);

  let lastUrl = location.href;
  function checkUrlChange() {
    if (location.href === lastUrl) return;
    lastUrl = location.href;
    const newRef = getPageRef();
    startListener(newRef);
    initData(newRef).catch(console.error);
  }

  window.addEventListener("popstate", checkUrlChange);
  window.addEventListener("hashchange", checkUrlChange);
  setInterval(checkUrlChange, 2000);

  /* ===== Click ===== */
  document.querySelectorAll(".reaction button").forEach((b) => {
    b.onclick = async () => {
      const key = b.dataset.k;
      if (clickLock.get(key)) return;
      clickLock.set(key, true);
      setTimeout(() => clickLock.delete(key), 400);

      const lock = "reacted_" + pageId + "_" + key;
      if (!isAdmin()) {
        if (localStorage.getItem(lock)) {
          showBubble(b, "Already selected!");
          return;
        }
        localStorage.setItem(lock, "1");
      }

      const countEl = b.querySelector(".count");
      if (countEl) countEl.textContent = parseInt(countEl.textContent || "0", 10) + 1;

      if (currentRef) {
        updateDoc(currentRef, { [key]: increment(1) }).catch(() => {});
      }

      if (key === "wow") {
        const animationsDisabled =
          document.documentElement.classList.contains("no-animations") ||
          document.body.classList.contains("no-animations") ||
          document.getElementById("comment-widget")?.classList.contains("no-animations");
        if (!animationsDisabled) {
          slimeEffect(b);
        }
      }
      else if (key === "like") likeEffect(b);
      else if (key === "angry2") angryEffect(b);
      else if (key === "haha") pinballEffect(b);
      else if (key === "sad") sadEffect(b);

      navigator.vibrate?.(30);
    };
  });

  function slimeEffect(btn) {
    if (
      document.documentElement.classList.contains("no-animations") ||
      document.body.classList.contains("no-animations") ||
      document.getElementById("comment-widget")?.classList.contains("no-animations")
    ) {
      return;
    }
    const box = document.getElementById("slime-container");
    if (!box) return;
    const r = btn.getBoundingClientRect();
    const total = 10 + Math.floor(Math.random() * 6);
    for (let i = 0; i < total; i++) {
      const s = document.createElement("div");
      s.className = "slime splash";
      const size = 22 + Math.random() * 40;
      s.style.width = size + "px";
      s.style.height = size * (1.3 + Math.random()) + "px";
      s.style.left = r.left + r.width / 2 + "px";
      s.style.top = r.top + r.height / 2 + "px";
      s.style.marginLeft = -size / 2 + "px";
      s.style.marginTop = -(size * 1.2) / 2 + "px";
      const dx = Math.random() * 200 - 100;
      const up = -250 - Math.random() * 200;
      const dx2 = dx * 1.1 + (Math.random() * 60 - 30);
      s.style.setProperty("--dx", dx + "px");
      s.style.setProperty("--up", up + "px");
      s.style.setProperty("--dx2", dx2 + "px");
      box.appendChild(s);
      const delay = 1400 + Math.random() * 400;
      setTimeout(() => {
        if (
          document.documentElement.classList.contains("no-animations") ||
          document.body.classList.contains("no-animations") ||
          document.getElementById("comment-widget")?.classList.contains("no-animations")
        ) {
          s.remove();
          return;
        }
        s.classList.remove("splash");
        s.classList.add("drip");
      }, delay);
      setTimeout(() => s.remove(), 6500);
    }
  }

  function likeEffect(btn) {
    const el = btn.querySelector("svg, img");
    if (!el) return;
    const r = btn.getBoundingClientRect();
    const total = 10 + Math.floor(Math.random() * 5);
    for (let i = 0; i < total; i++) {
      const f = document.createElement("div");
      f.className = "fire-particle";
      f.style.left = r.left + r.width / 2 + "px";
      f.style.top = r.top + r.height / 2 + "px";
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 80;
      f.style.setProperty("--x", Math.cos(angle) * dist + "px");
      f.style.setProperty("--y", Math.sin(angle) * dist + "px");
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 700);
    }
    el.style.transformOrigin = "center";
    el.style.willChange = "transform";
    const totalRotate = 1080 + 360;
    el.animate(
      [
        { transform: "rotate(0deg) scale(1)" },
        { transform: `rotate(${totalRotate}deg) scale(1.15)` }
      ],
      { duration: 5200, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", fill: "forwards" }
    );
  }

  function showBubble(btn, text) {
    const r = btn.getBoundingClientRect();
    const bubble = document.createElement("div");
    bubble.className = "manga-bubble";
    bubble.textContent = text;
    bubble.style.left = r.left + r.width / 2 + "px";
    bubble.style.top = r.top - 8 + "px";
    document.body.appendChild(bubble);
    requestAnimationFrame(() => {
      bubble.style.top = r.top - bubble.offsetHeight - 10 + "px";
    });
    setTimeout(() => {
      bubble.classList.add("manga-hide");
      setTimeout(() => bubble.remove(), 400);
    }, 1500);
  }

  function angryEffect(btn) {
    const el = btn.querySelector("svg, img");
    if (!el) return;
    el.classList.remove("angry-rage");
    void el.offsetWidth;
    el.classList.add("angry-rage");
    navigator.vibrate?.([80, 50, 80, 50, 120, 50, 80]);
    btn.style.transition = "filter 0.2s";
    btn.style.filter = "brightness(1.4) saturate(1.8)";
    setTimeout(() => { btn.style.filter = ""; }, 300);
  }

  function pinballEffect(btn) {
    const el = btn.querySelector("img, svg");
    if (!el) return;
    const rect = btn.getBoundingClientRect();
    el.classList.add("pinball-active");
    setTimeout(() => el.classList.remove("pinball-active"), 200);
    const startX = rect.left + rect.width / 2;
    const startY = rect.top + rect.height / 2;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let x = startX, y = startY;
    let vx = (Math.random() * 6 + 4) * (Math.random() > 0.5 ? 1 : -1);
    let vy = (Math.random() * 6 + 4) * (Math.random() > 0.5 ? 1 : -1);
    const points = [{ x, y }];
    for (let i = 0; i < 6; i++) {
      x += vx * 80;
      y += vy * 80;
      if (x < 0 || x > vw) { vx *= -1; x = Math.max(0, Math.min(vw, x)); }
      if (y < 0 || y > vh) { vy *= -1; y = Math.max(0, Math.min(vh, y)); }
      points.push({ x, y });
    }
    points.push({ x: startX, y: startY });
    el.animate(
      points.map((p) => ({ transform: `translate(${p.x - startX}px, ${p.y - startY}px)` })),
      { duration: 3000, easing: "cubic-bezier(.2,.8,.2,1)" }
    );
  }

  function sadEffect(btn) {
    const img = btn.querySelector("img, svg");
    if (!img) return;
    img.style.transition = "transform 1.4s cubic-bezier(0.4, 0, 0.2, 1)";
    img.style.transformOrigin = "50% 70%";
    img.style.transform = "scale(0.88) translateY(12px) rotate(-8deg)";
    setTimeout(() => {
      img.style.transform = "scale(1) translateY(0) rotate(0deg)";
    }, 1800);
    const rect = btn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height * 0.32;
    for (let i = 0; i < 18; i++) {
      const tear = document.createElement("div");
      const size = 5 + Math.random() * 7;
      tear.style.cssText = `
        position:fixed;width:${size}px;height:${size * 1.8}px;
        background:linear-gradient(transparent,#81d4fa,#29b6f6,#81d4fa);
        border-radius:50%;left:${centerX + (Math.random() * 22 - 11)}px;
        top:${centerY + (Math.random() * 8 - 4)}px;z-index:9999;opacity:0.85;
        pointer-events:none;filter:blur(0.5px);
        box-shadow:0 0 6px rgba(129,212,250,0.6);`;
      document.body.appendChild(tear);
      const delay = i * 65;
      const fallDuration = 2200 + Math.random() * 1100;
      const sideDrift = Math.random() * 45 - 22;
      tear.animate(
        [
          { transform: "translate(0,0) scale(0.4)", opacity: 0.9 },
          { transform: `translate(${sideDrift}px,210px) scale(1.15)`, opacity: 0 }
        ],
        { duration: fallDuration, delay, easing: "cubic-bezier(0.35, 0.0, 0.25, 1)" }
      );
      setTimeout(() => tear.remove(), fallDuration + delay + 300);
    }
    btn.style.transition = "filter 2s ease";
    btn.style.filter = "hue-rotate(190deg) saturate(0.65) brightness(0.9)";
    setTimeout(() => { btn.style.filter = ""; }, 1600);
