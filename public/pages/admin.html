<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Admin Panel Mikoroku</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<style>
/* ==================== GLASSMORPHISM (LIGHTWEIGHT) ==================== */
:root {
  color-scheme: dark;
  --bg: #0f1424;
  --text: #eef2ff;
  --text-dim: #9aa8c7;
  --input: rgba(22, 28, 48, 0.92);
  --border: rgba(255, 255, 255, 0.12);
  --glass: rgba(22, 28, 48, 0.88);
  --glass-strong: rgba(28, 36, 58, 0.95);
  --sidebar-bg: #12182a;
  --modal-bg: #161e32;
  --accent: #6b9bff;
  --accent-soft: rgba(107, 155, 255, 0.22);
  --accent-2: #a78bfa;
  --danger: #f87171;
  --success: #34d399;
  --warning: #fbbf24;
  --shadow-glass: 0 4px 20px rgba(0, 0, 0, 0.22);
  --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --radius: 14px;
  --radius-sm: 10px;
}

body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(91, 140, 255, 0.2) 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 90% 100%, rgba(167, 139, 250, 0.12) 0%, transparent 50%),
    var(--bg);
  font-family: var(--font-body);
  padding: 0;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.box {
  padding: 18px;
  margin: 0 0 16px;
  border-radius: var(--radius);
  width: 100%;
  position: relative;
  background: var(--glass);
  border: 1px solid var(--border);
  box-sizing: border-box;
  box-shadow: var(--shadow-glass);
}

input, textarea, select {
  width: 100%;
  padding: 10px 12px;
  margin: 6px 0;
  border-radius: var(--radius-sm);
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 14px;
  box-sizing: border-box;
  font-family: inherit;
  transition: border-color 0.15s, box-shadow 0.15s;
}

/* Dark mode */
body.dark select {
  background: rgba(22, 28, 48, 0.92) !important;
  color: #eef2ff !important;
  color-scheme: dark;
}

body.dark select option {
  background: #161e32 !important;
  color: #eef2ff !important;
}

/* Light mode */
body:not(.dark) select {
  background: rgba(255, 255, 255, 0.7) !important;
  color: #1a2035 !important;
  color-scheme: light;
}

body:not(.dark) select option {
  background: #ffffff !important;
  color: #1a2035 !important;
}


/* ==================== CHECKBOX ==================== */
input[type="checkbox"] {
  width: 18px !important;
  height: 18px;
  margin: 0 !important;
  padding: 0 !important;
  flex: 0 0 18px;
  cursor: pointer;
  accent-color: var(--accent);
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: rgba(91, 140, 255, 0.55);
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

button {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  background: transparent;
  color: var(--text);
  font-family: var(--font-display);
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
  box-shadow: none;
}

button:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(107, 155, 255, 0.45);
  color: var(--accent);
}
button:active { transform: scale(0.98); }

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(107, 155, 255, 0.4);
  color: var(--accent);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(248, 113, 113, 0.45);
}

.btn-danger:hover {
  background: rgba(248, 113, 113, 0.12);
  border-color: var(--danger);
  color: var(--danger);
}

.btn-success {
  background: transparent;
  color: var(--success);
  border-color: rgba(52, 211, 153, 0.45);
}

.btn-success:hover {
  background: rgba(52, 211, 153, 0.12);
  border-color: var(--success);
  color: var(--success);
}

.btn-small {
  padding: 6px 12px;
  font-size: 12px;
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  box-shadow: none;
}

.btn-outline:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--accent);
  border-color: rgba(91, 140, 255, 0.45);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

th {
  background: rgba(255, 255, 255, 0.06);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}

#mangaGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}

.manga-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
  cursor: pointer;
  position: relative;
  box-shadow: var(--shadow-glass);
}

.manga-card:hover {
  transform: translateY(-3px);
  border-color: rgba(107, 155, 255, 0.4);
  background: var(--glass-strong);
}

.manga-card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

.manga-card .cover-wrap {
  position: relative;
}

.source-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 9px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 999px;
  z-index: 2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  font-family: var(--font-display);
  pointer-events: none;
}
.source-badge.github {
  background: rgba(15, 23, 42, 0.75);
  color: #93c5fd;
  border: 1px solid rgba(147, 197, 253, 0.3);
}
.source-badge.firestore {
  background: rgba(91, 33, 182, 0.55);
  color: #e9d5ff;
  border: 1px solid rgba(167, 139, 250, 0.35);
}

.manga-card .meta .badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  display: inline-block;
  width: fit-content;
  font-family: var(--font-display);
}

.manga-card .info {
  padding: 12px;
}

.manga-card h3 {
  font-size: 14px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  min-height: 36px;
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--text);
}

.meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 11px;
  color: var(--text-dim);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}

.actions button {
  padding: 7px;
  font-size: 12px;
}

@media (max-width: 768px) {
  #mangaGrid {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .manga-card img { height: 140px; }
  .manga-card .info { padding: 8px; }
  .manga-card h3 { font-size: 12px; min-height: 30px; }
  .meta { font-size: 10px; }
  .actions button { padding: 5px; font-size: 11px; }
  .source-badge { font-size: 8px; padding: 3px 6px; top: 6px; left: 6px; }
}

#thumbPreview, #coverPreview {
  width: 100px;
  height: 133px;
  object-fit: cover;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: none;
  background: var(--glass);
  box-shadow: var(--shadow-glass);
}

#imageList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
  margin: 12px 0;
  max-height: 420px;
  overflow-y: auto;
  padding: 2px;
}

.image-item {
  position: relative;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  cursor: grab;
  aspect-ratio: 3/4;
  transition: border-color 0.15s;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.image-item:active { cursor: grabbing; }

.image-item:hover {
  border-color: rgba(107, 155, 255, 0.55);
}

.image-item.dragging {
  opacity: 0.5;
  border-color: var(--accent);
  touch-action: none;
  z-index: 5;
}

.image-item.drag-over {
  border-color: var(--success);
  outline: 2px solid rgba(52, 211, 153, 0.45);
  outline-offset: 1px;
}

.image-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.image-item .img-index {
  position: absolute;
  top: 4px;
  left: 4px;
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 4px;
  pointer-events: none;
  z-index: 2;
}

/* Nama file di pojok kiri bawah */
.image-item .img-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px 7px 7px;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.82),
    rgba(0, 0, 0, 0)
  );
  color: #fff;
  font-size: 9px;
  font-weight: 600;
  line-height: 1.25;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-item .img-actions {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(0, 0, 0, 0.7);
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 3;
}

.image-item:hover .img-actions,
.image-item:focus-within .img-actions { opacity: 1; }

@media (hover: none) {
  .image-item .img-actions { opacity: 1; }
}

.image-item .img-actions button {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 13px;
  padding: 7px 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: none;
  border-radius: 0;
}

.image-item .img-actions button:hover {
  background: rgba(91, 140, 255, 0.3);
  color: #fff;
}

.image-item .img-actions svg {
  width: 15px;
  height: 15px;
  display: block;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

h1, h2 {
  font-size: 18px;
  margin: 0 0 12px;
  font-family: var(--font-display);
  letter-spacing: -0.01em;
  color: var(--text);
  font-weight: 700;
}

.card {
  background: var(--glass);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin: 8px 0;
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--border);
}

.card img {
  width: 60px;
  height: 85px;
  object-fit: cover;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
}

.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: transparent;
  color: var(--accent);
  font-size: 24px;
  border: 1px solid rgba(107, 155, 255, 0.5);
  box-shadow: none;
  z-index: 2001;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fab:hover {
  background: rgba(107, 155, 255, 0.12);
  border-color: var(--accent);
  color: var(--accent);
}

#fabMenu {
  position: fixed;
  z-index: 2000;
  bottom: 86px;
  right: 24px;
  display: none;
  flex-direction: column;
  gap: 10px;
}

#fabMenu button {
  border-radius: 999px;
}

.chapter-item {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: grab;
  transition: transform 0.15s, border-color 0.15s;
}

.chapter-item:hover {
  transform: translateY(-2px);
  border-color: rgba(107, 155, 255, 0.4);
}

.chapter-item .ch-info b {
  font-size: 13px;
  line-height: 1.3;
  font-family: var(--font-display);
  color: var(--text);
  font-weight: 600;
}

.chapter-item .ch-info small {
  color: var(--text-dim);
  font-size: 11px;
}

.chapter-item .ch-actions {
  display: flex;
  gap: 6px;
  margin-top: auto;
}

.chapter-item .ch-actions button {
  flex: 1;
  padding: 6px;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: none;
}

.chapter-item .ch-actions button:hover {
  background: transparent;
  color: var(--accent);
  border-color: rgba(91, 140, 255, 0.45);
}

body.dark input,
body.dark textarea,
body.dark select {
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
  border-color: var(--border);
}

body.dark th { background: rgba(255, 255, 255, 0.06); }
body.dark td { border-bottom: 1px solid var(--border); }
body.dark .image-item { background: transparent; }

img { max-width: 100%; height: auto; }

/* Login */
#loginWrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 25% 15%, rgba(91, 140, 255, 0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 85%, rgba(167, 139, 250, 0.3) 0%, transparent 45%),
    url("https://i.ibb.co/DgLF7wgr/5da90ce5b424.jpg") center/cover no-repeat;
  z-index: 9999;
  overflow: hidden;
}

#loginWrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(11, 16, 32, 0.72);
  z-index: 0;
}

#loginBox {
  position: relative;
  z-index: 1;
  max-width: 380px;
  width: 90%;
  margin: auto;
  padding: 32px;
  text-align: center;
  color: var(--text);
  
  /* Glassmorphism */
  background: rgba(22, 28, 48, 0.42);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 20px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}

#loginBox h2 {
  font-size: 20px;
  margin-bottom: 18px;
  color: var(--text);
  font-family: var(--font-display);
  font-weight: 700;
}

#loginBox input {
  margin: 8px 0;
  background: var(--input);
  color: var(--text);
  border-color: var(--border);
  border-radius: 12px;
}

#loginBox button {
  width: 100%;
  margin-top: 14px;
  font-size: 14px;
  border-radius: 12px;
}

#loginError {
  margin-top: 12px;
  font-size: 13px;
  color: #fff;
  background: rgba(248, 113, 113, 0.25);
  border: 1px solid rgba(248, 113, 113, 0.4);
  padding: 10px;
  border-radius: 12px;
  display: none;
}

@media (max-width: 480px) {
  #loginWrapper {
    padding: 20px;
    box-sizing: border-box;
  }
  
  #loginBox {
    width: 100%;
    max-width: 380px;
    box-sizing: border-box;
    padding: 26px 22px;
  }
}

/* Loading */
#loadingOverlay {
  position: fixed !important;
  inset: 0 !important;
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  width: 100vw !important;
  height: 100vh !important;
  background: rgba(11, 16, 32, 0.55) !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 2147483647 !important;
  transition:
    opacity 0.2s ease,
    visibility 0.2s ease;
}

#loadingOverlay.active {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: all !important;
}

#loadingOverlay .loadingSlide {
  margin: 0 !important;

  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  background: rgba(25, 32, 52, 0.96);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
  font-size: 13px;
  font-weight: 600;
}

#loadingOverlay .loadingSlide p {
  margin: 0;
}

#loadingOverlay .spinner {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: loadingSpin 0.7s linear infinite;
}

@keyframes loadingSpin {
  to {
    transform: rotate(360deg);
  }
}


/* Quill */
#editor, #chapterEditor {
  background: rgba(255, 255, 255, 0.06) !important;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.ql-toolbar.ql-snow {
  background: rgba(255, 255, 255, 0.08) !important;
  border: 1px solid var(--border) !important;
  border-bottom: none !important;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}

.ql-container.ql-snow {
  border: 1px solid var(--border) !important;
  border-top: none !important;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  background: transparent;
  color: var(--text);
}

.ql-editor {
  min-height: 160px;
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
  font-family: var(--font-body);
}

.ql-editor.ql-blank::before { color: var(--text-dim); }

.ql-snow .ql-stroke { stroke: var(--text-dim) !important; }
.ql-snow .ql-fill { fill: var(--text-dim) !important; }
.ql-snow .ql-picker { color: var(--text-dim) !important; }
.ql-snow.ql-toolbar button:hover .ql-stroke,
.ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: var(--accent) !important; }
.ql-snow.ql-toolbar button:hover .ql-fill,
.ql-snow .ql-toolbar button.ql-active .ql-fill { fill: var(--accent) !important; }

body.dark #editor,
body.dark #chapterEditor {
  background: rgba(255, 255, 255, 0.06) !important;
  color: var(--text) !important;
}

body.dark .ql-toolbar.ql-snow {
  background: rgba(255, 255, 255, 0.08) !important;
  border-color: var(--border) !important;
}

body.dark .ql-container.ql-snow {
  background: transparent !important;
  border-color: var(--border) !important;
}

body.dark .ql-editor { color: var(--text) !important; }
body.dark .ql-editor.ql-blank::before { color: var(--text-dim); }

/* Header & Sidebar */
#adminHeader {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  background: var(--glass);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  position: sticky;
  top: 12px;
  z-index: 100;
  box-shadow: var(--shadow-glass);
  border: 1px solid var(--border);
}

#adminTitle {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  flex: 1;
  min-width: 140px;
  font-family: var(--font-display);
  color: var(--text);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  justify-content: flex-end;
}

#searchInput {
  flex: 1;
  max-width: 300px;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-body);
}

#searchInput:focus {
  outline: none;
  border-color: rgba(91, 140, 255, 0.5);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 240px;
  height: 100vh;
  background:

/* ==================== UNIFIED MANGA DETAIL ==================== */
.manga-detail-header {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.manga-detail-header .cover-wrap {
  flex-shrink: 0;
}

.manga-detail-header .cover-wrap img {
  width: 120px;
  height: 170px;
  object-fit: cover;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-glass);
}

.manga-detail-header .meta-info {
  flex: 1;
  min-width: 200px;
}

.manga-detail-header h1 {
  font-size: 22px;
  margin: 0 0 6px;
  line-height: 1.25;
  font-family: var(--font-display);
  color: var(--text);
  font-weight: 700;
}

.manga-detail-header .badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.badge {
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #c7d7ff;
  font-weight: 600;
  font-family: var(--font-display);
  border: 1px solid rgba(91, 140, 255, 0.3);
}

.badge.status-ongoing { background: rgba(52, 211, 153, 0.15); color: var(--success); border-color: rgba(52, 211, 153, 0.35); }
.badge.status-completed { background: rgba(91, 140, 255, 0.15); color: #93c5fd; border-color: rgba(91, 140, 255, 0.35); }
.badge.status-hiatus { background: rgba(251, 191, 36, 0.15); color: var(--warning); border-color: rgba(251, 191, 36, 0.35); }
.badge.status-dropped,
.badge.status-canceled,
.badge.status-cancelled { background: rgba(248, 113, 113, 0.15); color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }
.badge.status-unknown { background: rgba(160, 174, 200, 0.12); color: var(--text-dim); border-color: rgba(160, 174, 200, 0.25); }

.detail-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
}

.tab-btn {
  padding: 10px 18px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-dim);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 0;
  opacity: 1;
  font-family: var(--font-body);
  box-shadow: none;
  text-transform: none;
  letter-spacing: 0;
}

.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  border-bottom-color: var(--accent);
  color: #fff;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Form grid */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .manga-detail-header .cover-wrap img { width: 90px; height: 128px; }
}

.form-section-title {
  font-size: 12px;
  font-weight: 600;
  margin: 16px 0 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--font-display);
}

label.field-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 2px;
  color: var(--text-dim);
}

body.dark label.field-label { color: var(--text-dim); }

/* Chapter list in detail */
#chapterList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 12px;
}

@media (max-width: 480px) {
  #chapterList {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
}

.chapter-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.cache-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #c7d7ff;
  margin-left: 6px;
  border: 1px solid rgba(91, 140, 255, 0.3);
  font-family: var(--font-body);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 16, 32, 0.7);
  z-index: 3000;
  display: none;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  overflow-y: auto;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: var(--modal-bg);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 720px;
  margin: 20px auto;
  border: 1px solid var(--border);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
  position: relative;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  border: 1px solid var(--border);
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: none;
  z-index: 5;
  padding: 0;
}

.modal-close:hover {
  background: rgba(248, 113, 113, 0.15);
  color: var(--danger);
  border-color: rgba(248, 113, 113, 0.55);
}

.modal-close svg {
  width: 22px;
  height: 22px;
}

/* Back button */
.back-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: none;
  font-family: var(--font-body);
}

.back-btn:hover {
  background: transparent;
  border-color: rgba(91, 140, 255, 0.45);
  color: var(--text);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-dim);
}

.empty-state h3 {
  margin: 0 0 8px;
  font-size: 16px;
  font-family: var(--font-display);
  color: var(--text);

/* Moderation table */
#moderationPanel table {
  min-width: 700px;
}

#moderationPanel th,
#moderationPanel td {
  padding: 12px 10px;
  white-space: normal;
  word-break: break-word;

}

#moderationPanel th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(255, 255, 255, 0.08);

#mUpdateDate {

/* scrollbar glass */

::-webkit-scrollbar-track { background: transparent; }

  background: rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); background-clip: padding-box; }

/* ============================================================

const CACHE = {

function slimMangaForCache(m) {
  if (!m || typeof m !== "object") return m;
  const chapterCount = typeof m.chapterCount === "number"
    ? m.chapterCount
    : Object.keys(m.chapters || {}).length;
  return {
    slug: m.slug,
    title: m.title || "",
    altTitle: m.altTitle || "",
    cover: m.cover || m.img || "",
    desc: typeof m.desc === "string" ? m.desc.slice(0, 400) : "",
    type: m.type || "manga",
    status: m.status || "unknown",
    author: m.author || "",
    artist: m.artist || "",
    circle: m.circle || "",
    group: m.group || "",
    series: m.series || "",
    serialization: m.serialization || "",
    publication: m.publication || "",
    genres: Array.isArray(m.genres) ? m.genres.slice(0, 40) : [],
    tags: Array.isArray(m.tags) ? m.tags.slice(0, 40) : [],
    femaleTags: Array.isArray(m.femaleTags) ? m.femaleTags.slice(0, 30) : [],
    maleTags: Array.isArray(m.maleTags) ? m.maleTags.slice(0, 30) : [],
    characters: Array.isArray(m.characters)
      ? m.characters.slice(0, 40)
      : (typeof m.characters === "string" ? m.characters.slice(0, 200) : ""),
    rating: m.rating ?? 0,
    chapterCount,
    updatedAt: m.updatedAt || 0,
    latestUpdate: m.latestUpdate || 0,
    lastChapter: m.lastChapter || null,
    lastChapterUpdated: m.lastChapterUpdated || null,
    source: m.source || "firestore",
    origin: m.origin || "firestore",
    githubSlug: m.githubSlug || null,
    managedByAdmin: !!m.managedByAdmin,
    isDraft: !!m.isDraft
  };
}

function slimChapterForCache(list) {
  if (!Array.isArray(list)) return list;
  return list.map(ch => {
    if (!ch || typeof ch !== "object") return ch;
    const images = Array.isArray(ch.images) ? ch.images.filter(Boolean) : [];
    return {
      num: ch.num,
      title: ch.title || "",
      thumbnail: ch.thumbnail || "",
      images,
      content: typeof ch.content === "string" ? ch.content.slice(0, 2000) : "",
      date: ch.date || 0,
      order: ch.order ?? 0,
      isDraft: !!ch.isDraft
    };
  });
}

function getCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    return { data, ts };
  } catch {
    return null;
  }
}

function clearMkCache() {
  Object.keys(localStorage)
    .filter(k => k.startsWith("mk_"))
    .forEach(k => {
      try { localStorage.removeItem(k); } catch (_) {}
    });
}

function setCache(key, data) {
  const payload = JSON.stringify({ data, ts: Date.now() });
  try {
    localStorage.setItem(key, payload);
    return true;
  } catch (e) {
    console.warn("localStorage penuh, membersihkan cache mk_* ...", e);
    clearMkCache();
    try {
      localStorage.setItem(key, payload);
      return true;
    } catch (e2) {
      console.warn("Skip cache (masih penuh):", key, e2 && e2.name);
      return false;
    }
  }
}

function isFresh(entry, ttl) {
  return entry && (Date.now() - entry.ts < ttl);
}

function invalidateMangaCache() {
  try {
    localStorage.removeItem(CACHE.MANGA.key);
    localStorage.removeItem(CACHE.LIGHT.key);
  } catch (_) {}
}

function invalidateChapterCache(slug) {
  if (!slug) return;
  try { localStorage.removeItem(CACHE.CHAPTER.key + slug); } catch (_) {}
}

(function purgeLegacyCache() {
  try {
    ["mk_manga_v3", "mk_light_v3", "mk_github_v3"].forEach(k => localStorage.removeItem(k));
    Object.keys(localStorage)
      .filter(k => k.startsWith("mk_chap_") && !k.startsWith("mk_chap_v4_"))
      .forEach(k => localStorage.removeItem(k));
  } catch (_) {}
})();

/* ============================================================
   FIRESTORE CACHE-FIRST HELPERS
   ============================================================ */
async function getDocCacheFirst(ref) {
  try {
    return await getDocFromCache(ref);
  } catch (_) {
    return await getDoc(ref);
  }
}

async function getDocsCacheFirst(q) {
  try {
    return await getDocsFromCache(q);
  } catch (_) {
    return await getDocs(q);
  }
}

function toSummaryEntry(m) {
  if (!m) return null;
  const chapterCount = typeof m.chapterCount === "number"
    ? m.chapterCount
    : Object.keys(m.chapters || {}).length;
  return {
    slug: m.slug,
    title: m.title || "",
    altTitle: m.altTitle || "",
    cover: m.cover || m.img || "",
    type: m.type || "manga",
    status: (m.status || "unknown").toLowerCase(),
    author: m.author || "",
    genres: Array.isArray(m.genres) ? m.genres.slice(0, 12) : [],
    rating: m.rating ?? 0,
    chapterCount,
    updatedAt: m.updatedAt || m.latestUpdate || 0,
    lastChapter: m.lastChapter || null,
    source: m.source || "firestore",
    origin: m.origin || "firestore",
    githubSlug: m.githubSlug || null,
    managedByAdmin: !!m.managedByAdmin,
    isDraft: !!m.isDraft
  };
}

async function rebuildMangaSummary(list = null) {
  const data = list || allMangaData;
  const entries = data
    .map(toSummaryEntry)
    .filter(Boolean)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  await setDoc(SUMMARY_DOC, {
    list: entries,
    count: entries.length,
    updatedAt: Date.now()
  }, { merge: true });
  return entries;
}

async function upsertSummaryEntry(manga) {
  const entry = toSummaryEntry(manga);
  if (!entry?.slug) return;
  try {
    const snap = await getDocCacheFirst(SUMMARY_DOC);
    let list = [];
    if (snap.exists()) {
      list = Array.isArray(snap.data().list) ? [...snap.data().list] : [];
    }
    const idx = list.findIndex(x => x.slug === entry.slug);
    if (idx >= 0) list[idx] = entry;
    else list.push(entry);
    list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    await setDoc(SUMMARY_DOC, {
      list,
      count: list.length,
      updatedAt: Date.now()
    }, { merge: true });
  } catch (e) {
    console.warn("upsertSummaryEntry failed, will rebuild on next full load:", e);
  }
}

async function removeSummaryEntry(slug) {
  try {
    const snap = await getDocCacheFirst(SUMMARY_DOC);
    if (!snap.exists()) return;
    const list = (snap.data().list || []).filter(x => x.slug !== slug);
    await setDoc(SUMMARY_DOC, {
      list,
      count: list.length,
      updatedAt: Date.now()
    }, { merge: true });
  } catch (e) {
    console.warn("removeSummaryEntry:", e);
  }
}

function showLoading(text = "Loading...") {
  let overlay = document.getElementById("loadingOverlay");

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "loadingOverlay";

    overlay.innerHTML = `
      <div class="loadingSlide">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
      </div>
    `;

    document.body.appendChild(overlay);
  }

  if (overlay.parentElement !== document.body) {
    document.body.appendChild(overlay);
  }

  const txt = overlay.querySelector("#loadingText");
  if (txt) txt.textContent = text;

  overlay.classList.add("active");
  void overlay.offsetHeight;
}

function hideLoading() {
  const overlay = document.getElementById("loadingOverlay");
  if (!overlay) return;

  overlay.classList.remove("active");
}

function slugify(text) {
  return String(text).toLowerCase().trim()
    .replace(/\s+/g, "-")
    .replace(/[^\w\-]+/g, "")
    .replace(/\-\-+/g, "-");
}

function getThumbnail(url) {
  if (!url || String(url).trim() === "" || String(url).trim() === "-") return "";
  url = String(url).replace(/\.$/, "").trim();
  if (!/^https?:\/\//i.test(url)) url = GITHUB_RAW + url;
  return url;
}

function getCoverPreview(url) {
  if (!url) return "";
  url = String(url).trim();
  if (!/^https?:\/\//i.test(url)) url = GITHUB_RAW + url;
  return "https://images.weserv.nl/?url=" + encodeURIComponent(url) + "&w=200&q=80&output=webp";
}

function getSmallPreview(url, w = 150) {
  if (!url) return "";
  url = String(url).trim();
  if (!url || url === "-") return "";
  if (!/^https?:\/\//i.test(url)) url = GITHUB_RAW + url.replace(/^\//, "");
  return "https://images.weserv.nl/?url=" + encodeURIComponent(url) + "&w=" + w + "&q=70&output=webp";
}

function normalizeImages(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  if (typeof data === "string") {
    if (data.includes("<img")) {
      const doc = new DOMParser().parseFromString(data, "text/html");
      return [...doc.querySelectorAll("img")].map(img => img.src);
    }
    try {
      const parsed = JSON.parse(data);
      if (Array.isArray(parsed)) return parsed;
    } catch {}
  }
  if (typeof data === "object") return Object.values(data);
  return [];
}

function fixBloggerImage(url) {
  if (!url) return url;
  return url.replace(/\/s\d+\//, "/s800/").replace(/\/w\d+-h\d+/, "/s500");
}

function cleanImageUrls(content = "") {
  if (!content) return [];
  content = content.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"');
  let urls = [];
  const doc = new DOMParser().parseFromString(content, "text/html");
  urls.push(...[...doc.querySelectorAll("img")].map(img => img.src || img.getAttribute("src")).filter(Boolean));
  const regex = /https?:\/\/[^\s"'<>]+?\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?[^\s"'<>]*)?/gi;
  urls.push(...(content.match(regex) || []));
  if (urls.length === 0) {
    urls = content.match(/https?:\/\/[^\s"'<>]+/g) || [];
  }
  urls = urls.map(url => url.replace(/loading="?lazy"?/gi, "").replace(/["'>]/g, "").trim());
  urls = urls.map(fixBloggerImage);
  return [...new Set(urls.filter(Boolean))];
}

function extractImagesFromQuill() {
  if (!chapterQuill) return [];
  return cleanImageUrls(chapterQuill.root.innerHTML || "");
}

async function loadGithubManga(force = false) {
  const cached = getCache(CACHE.GITHUB.key);
  if (!force && isFresh(cached, CACHE.GITHUB.ttl)) {
    return cached.data;
  }
  try {
    const res = await fetch(GITHUB_JSON + "?t=" + Date.now());
    if (!res.ok) throw new Error("Github gagal");
    const data = await res.json();
    const mapped = data.map(m => ({ ...m, cover: m.cover || m.img || "" }));
    setCache(CACHE.GITHUB.key, mapped);
    return mapped;
  } catch (e) {
    console.warn("GitHub load error:", e);
    return cached?.data || [];
  }
}

/* ============================================================
   LOAD ALL MANGA
   ============================================================ */
async function loadAllMangaData(force = false) {
  // 1) LocalStorage cache (fastest)
  const cached = getCache(CACHE.MANGA.key);
  if (!force && isFresh(cached, CACHE.MANGA.ttl)) {
    allMangaData = cached.data;
    lightMangaList = allMangaData.map(m => ({ slug: m.slug, title: m.title || m.slug }));
    return allMangaData;
  }

  showLoading("Loading manga data...");
  try {
    if (!force) {
      try {
        const summarySnap = await getDocCacheFirst(SUMMARY_DOC);
        if (summarySnap.exists()) {
          const list = summarySnap.data().list;
          if (Array.isArray(list) && list.length > 0) {
            allMangaData = list.map(m => ({ ...m, source: m.source || "firestore" }));
            allMangaData.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            lightMangaList = allMangaData.map(m => ({
              slug: m.slug,
              title: m.title || m.slug
            }));
            setCache(CACHE.MANGA.key, allMangaData.map(slimMangaForCache));
            setCache(CACHE.LIGHT.key, lightMangaList);
            return allMangaData;
          }
        }
      } catch (e) {
        console.warn("Summary doc miss, falling back to full scan:", e);
      }
    }

    const merged = {};
    const titleMap = {};
    const normTitleFs = (t) => String(t || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();

    let lastDoc = null;
    let hasMore = true;
    try {
      while (hasMore) {
        let q = lastDoc
          ? query(collection(firestore, "manga"), orderBy("updatedAt", "desc"), startAfter(lastDoc), limit(PAGE_SIZE))
          : query(collection(firestore, "manga"), orderBy("updatedAt", "desc"), limit(PAGE_SIZE));
        const snap = await getDocs(q);
        if (snap.empty) {
          hasMore = false;
          break;
        }
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const { chapters, ...rest } = data;
          const slug = docSnap.id;
          const titleKey = normTitleFs(data.title || "");
          const chapterCount = typeof data.chapterCount === "number"
            ? data.chapterCount
            : (chapters && typeof chapters === "object" ? Object.keys(chapters).length : 0);
          merged[slug] = {
            slug,
            source: "firestore",
            managedByAdmin: !!data.managedByAdmin,
            ...rest,
            chapterCount
          };
          if (titleKey) titleMap[titleKey] = slug;
        });
        lastDoc = snap.docs[snap.docs.length - 1];
        if (snap.size < PAGE_SIZE) hasMore = false;
      }
    } catch (orderErr) {
      console.warn("orderBy(updatedAt) failed, falling back to plain limit:", orderErr);
      const snap = await getDocs(query(collection(firestore, "manga"), limit(500)));
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const { chapters, ...rest } = data;
        const slug = docSnap.id;
        const titleKey = normTitleFs(data.title || "");
        const chapterCount = typeof data.chapterCount === "number"
          ? data.chapterCount
          : (chapters && typeof chapters === "object" ? Object.keys(chapters).length : 0);
        merged[slug] = {
          slug,
          source: "firestore",
          managedByAdmin: !!data.managedByAdmin,
          ...rest,
          chapterCount
        };
        if (titleKey) titleMap[titleKey] = slug;
      });
    }

    const githubList = await loadGithubManga(force);

    const fillIfEmpty = (existing, githubVal) => {
      if (existing == null || existing === "" || (Array.isArray(existing) && existing.length === 0)) {
        return githubVal;
      }
      return existing;
    };

    const normTitle = (t) => String(t || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();

    githubList.forEach(manga => {
      const rawTitle = manga.title || manga.name || "";
      const slug = (manga.slug && String(manga.slug).trim()) || slugify(rawTitle) || "untitled";
      const titleKey = normTitle(rawTitle);
      const githubDesc = manga.desc || manga.description || manga.synopsis || manga.sinopsis || "";

      const applyGithubMeta = (ex) => {
        const genres = manga.genres || manga.genre || [];
        const tags = manga.tags || [];
        return {
          ...ex,
          title: fillIfEmpty(ex.title, rawTitle),
          altTitle: fillIfEmpty(ex.altTitle, manga.altTitle || manga.alternative || manga.alt_title || ""),
          cover: fillIfEmpty(ex.cover, manga.cover || manga.img || ""),
          desc: fillIfEmpty(ex.desc, githubDesc),
          status: fillIfEmpty(ex.status, manga.status || "unknown"),
          type: fillIfEmpty(ex.type, manga.type || "manga"),
          author: fillIfEmpty(ex.author, manga.author || manga.authors || ""),
          artist: fillIfEmpty(ex.artist, manga.artist || manga.artists || ""),
          circle: fillIfEmpty(ex.circle, manga.circle || ""),
          group: fillIfEmpty(ex.group, manga.group || ""),
          series: fillIfEmpty(ex.series, manga.series || ""),
          serialization: fillIfEmpty(ex.serialization, manga.serialization || ""),
          publication: fillIfEmpty(ex.publication, manga.publication || manga.year || ""),
          genres: fillIfEmpty(ex.genres, Array.isArray(genres) ? genres : (typeof genres === "string" ? genres.split(",").map(s => s.trim()).filter(Boolean) : [])),
          tags: fillIfEmpty(ex.tags, Array.isArray(tags) ? tags : []),
          characters: fillIfEmpty(ex.characters, manga.characters || ""),
          rating: (ex.rating == null || ex.rating === 0) ? (manga.rating ?? 0) : ex.rating,
          githubSlug: slug,
          source: ex.source === "firestore" || ex.managedByAdmin ? "hybrid" : "hybrid"
        };
      };

      if (merged[slug]) {
        merged[slug] = applyGithubMeta(merged[slug]);
        return;
      }

      if (titleKey && titleMap[titleKey]) {
        const existingSlug = titleMap[titleKey];
        merged[existingSlug] = applyGithubMeta({
          ...merged[existingSlug],
          githubSlug: slug
        });
        return;
      }

      merged[slug] = {
        ...manga,
        title: rawTitle || slug,
        cover: manga.cover || manga.img || "",
        desc: githubDesc,
        slug,
        githubSlug: slug,
        source: "github"
      };
      if (titleKey) titleMap[titleKey] = slug;
    });

    allMangaData = Object.values(merged);
    allMangaData.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    lightMangaList = allMangaData.map(m => ({
      slug: m.slug,
      title: m.title || m.slug
    }));

    setCache(CACHE.MANGA.key, allMangaData.map(slimMangaForCache));
    setCache(CACHE.LIGHT.key, lightMangaList);

    try {
      await rebuildMangaSummary(allMangaData);
    } catch (e) {
      console.warn("Failed to write mangaSummary:", e);
    }

    return allMangaData;
  } finally {
    hideLoading();
  }
}

async function getLightMangaList(force = false) {
  if (!force && lightMangaList.length) return lightMangaList;
  const cached = getCache(CACHE.LIGHT.key);
  if (!force && isFresh(cached, CACHE.LIGHT.ttl)) {
    lightMangaList = cached.data;
    return lightMangaList;
  }
  await loadAllMangaData(force);
  return lightMangaList;
}

function renderMangaGrid(data = allMangaData) {
  const list = Array.isArray(data) ? data : allMangaData;
  let target = document.getElementById("mangaGrid");
  if (!target) {
    const container = document.getElementById("dynamicContent");
    if (!container) return;
    container.innerHTML = '<div id="mangaGrid"></div>';
    target = document.getElementById("mangaGrid");
  }

  target.innerHTML = list.map(m => {
    const title = m.title || m.slug || "Untitled";
    const statusRaw = String(m.status != null ? m.status : "unknown").toLowerCase();
    const status = statusRaw.toUpperCase();
    const chapterCount = (typeof m.chapterCount === "number" && m.chapterCount > 0)
      ? m.chapterCount
      : Object.keys(m.chapters || {}).length;
    const safeSlug = (m.slug || "").replace(/'/g, "\\'");
    const cover = getCoverPreview(m.cover || m.img);
    const safeTitle = String(title).replace(/"/g, "&quot;");
    const isGithubOnly = m.source === "github" && !m.managedByAdmin;
    const sourceClass = isGithubOnly ? "github" : "firestore";
    const sourceLabel = isGithubOnly ? "Github" : "Firestore";

    return `
      <div class="manga-card" onclick="openMangaDetail('${safeSlug}')">
        <div class="cover-wrap">
          <img src="${cover}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Cover'" alt="${safeTitle}">
          <span class="source-badge ${sourceClass}">${sourceLabel}</span>
        </div>
        <div class="info">
          <h3 title="${safeTitle}">${title}</h3>
          <div class="meta">
            <span class="badge status-${statusRaw}">${status}</span>
            <span>${chapterCount} Chapter</span>
          </div>
          <div class="actions" onclick="event.stopPropagation()">
            <button onclick="openMangaDetail('${safeSlug}')">Edit</button>
            <button class="btn-danger" onclick="deleteManga('${safeSlug}')">Delete</button>
          </div>
        </div>
      </div>`;
  }).join("");
}

   ============================================================ */
window.loadChapterList = async function(force = false) {
  const slug = currentDetailSlug || currentSlug;
  const container = document.getElementById("chapterList");
  if (!slug) {
    if (container) container.innerHTML = "";
    return;
  }
  currentSlug = slug;

  const cacheKey = CACHE.CHAPTER.key + slug;
  const cached = getCache(cacheKey);

  if (!force && isFresh(cached, CACHE.CHAPTER.ttl) && Array.isArray(cached.data) && cached.data.length > 0) {
    chapterCache = cached.data;
    renderChapterList();
    return;
  }

  try {
    showLoading("Loading chapters...");
    chapterCache = [];

    let chapSnap = await getDocs(
      query(collection(firestore, "manga", slug, "chapters"), limit(300))
    );

    if (!chapSnap.empty) {
      chapSnap.forEach(d => {
        const val = d.data();
        chapterCache.push({
          num: d.id,
          title: val.title || "",
          thumbnail: val.thumbnail || "",
          date: val.date || 0,
          order: val.order ?? 0,
          isDraft: !!val.isDraft,
          images: normalizeImages(val.images),
          content: val.content || ""
        });
      });
    }

    if (chapterCache.length === 0) {
      const mangaSnap = await getDoc(doc(firestore, "manga", slug));
      const raw = mangaSnap.exists() ? (mangaSnap.data().chapters || {}) : {};
      chapterCache = Object.entries(raw)
        .map(([num, val]) => ({
          num,
          title: val.title || ("Chapter " + num),
          thumbnail: val.thumbnail || "",
          date: val.date || 0,
          order: val.order ?? 0,
          isDraft: !!val.isDraft,
          images: normalizeImages(val.images),
          content: val.content || val.text || val.html || ""
        }));
    }

    chapterCache.sort((a, b) => {
      const ao = a.order ?? 0;
      const bo = b.order ?? 0;
      if (ao !== bo) return bo - ao;
      const an = parseFloat(String(a.num).replace(/[^\d.]/g, "")) || 0;
      const bn = parseFloat(String(b.num).replace(/[^\d.]/g, "")) || 0;
      return bn - an;
    });

    setCache(cacheKey, slimChapterForCache(chapterCache));
    renderChapterList();
  } catch (e) {
    console.error(e);
    if (container) container.innerHTML = `<p style="color:red">Failed to load chapters: ${e.message}</p>`;
  } finally {
    hideLoading();
  }
};

function renderChapterList() {
  const container = document.getElementById("chapterList");
  if (!container) return;

  if (!chapterCache.length) {
    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No chapters yet. Click "Add Chapter" to start.</p></div>`;
    return;
  }

  container.innerHTML = chapterCache.map((ch, index) => `
    <div class="chapter-item" draggable="true" data-index="${index}">
      <div class="ch-info">
        <b>
  ${ch.title || "Chapter " + ch.num}
  ${ch.isDraft
    ? '<span style="display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(234,179,8,0.18);color:#fbbf24;font-size:9px;font-weight:700;vertical-align:middle;">DRAFT</span>'
    : ''
  }
</b>
<small>${ch.date ? new Date(ch.date).toLocaleString("id-ID") : "-"}</small>
      </div>
      <div class="ch-actions">
        <button onclick="editChapter('${ch.num}')" title="Edit" aria-label="Edit">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        </button>
        <button onclick="deleteChapter('${ch.num}')" title="Delete" aria-label="Delete">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
  `).join("");

  enableDrag();
}

function enableDrag() {
  document.querySelectorAll(".chapter-item").forEach(item => {
    item.addEventListener("dragstart", e => e.dataTransfer.setData("index", item.dataset.index));
    item.addEventListener("dragover", e => e.preventDefault());
    item.addEventListener("drop", e => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData("index"));
      const to = Number(item.dataset.index);
      const moved = chapterCache.splice(from, 1)[0];
      chapterCache.splice(to, 0, moved);
      renderChapterList();
    });
  });
}

window.saveChapterOrder = async function() {
  if (!currentSlug) return alert("Select a manga first!");
  try {
    showLoading("Saving order...");
    let batch = writeBatch(firestore);
    let ops = 0;
    for (let i = 0; i < chapterCache.length; i++) {
      const ch = chapterCache[i];
      const order = chapterCache.length - i;
      batch.update(doc(firestore, "manga", currentSlug, "chapters", String(ch.num)), { order });
      ops++;
      if (ops >= 450) {
        await batch.commit();
        batch = writeBatch(firestore);
        ops = 0;
      }
    }
    if (ops > 0) await batch.commit();
    await updateDoc(doc(firestore, "manga", currentSlug), { updatedAt: Date.now() });
    invalidateChapterCache(currentSlug);
    setCache(CACHE.CHAPTER.key + currentSlug, slimChapterForCache(chapterCache));
    alert("✅ Chapter order saved!");
  } catch (err) {
    console.error(err);
    alert("❌ Failed to save order:\n" + err.message);
  } finally {
    hideLoading();
  }
};

/* ============================================================
   UPLOAD (ImgBB)
   ============================================================ */
async function uploadToImgBB(file) {
  const formData = new FormData();
  formData.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: "POST", body: formData
  });
  const data = await res.json();
  if (!data.success) throw new Error(data.error?.message || "Upload gagal");
  return data.data.url;
}

  document.getElementById("chapterMangaPicker").style.display = "none";
  document.getElementById("editingMangaInfo").style.display = "block";

  const mangaName = lightMangaList.find(m => m.slug === (currentSlug || currentDetailSlug))?.title || currentSlug;
  document.getElementById("editingMangaName").textContent = mangaName;
  document.getElementById("chapterModalTitle").textContent = "Edit Chapter " + num;

  document.getElementById("cNumber").value = num;
  document.getElementById("cThumb").value = ch.thumbnail || "";
  document.getElementById("cTitle").value = ch.title || "";

  const draft = document.getElementById("cDraft");
  if (draft) draft.checked = !!ch.isDraft;

  let imgs = normalizeImages(ch.images);
  if (typeof imgs === "string") imgs = cleanImageUrls(imgs);
  if (!Array.isArray(imgs)) imgs = Object.values(imgs || []);
  currentImageList = imgs;
  renderImageList();

  if (chapterQuill) {
    chapterQuill.root.innerHTML = ch.content || ch.text || ch.html || "";
  }

  const preview = document.getElementById("thumbPreview");
  if (preview) {
    if (ch.thumbnail) {
      preview.src = getSmallPreview(ch.thumbnail);
      preview.style.display = "block";
    } else {
      preview.src = "";
      preview.style.display = "none";
    }
  }

  document.getElementById("chapterModal").classList.add("active");
};

window.deleteChapter = async function(num) {
  if (!currentSlug) return;
  if (!confirm("Delete chapter " + num + "?")) return;
  try {
    await deleteDoc(doc(firestore, "manga", currentSlug, "chapters", String(num)));
    const mangaRef = doc(firestore, "manga", currentSlug);
    const snap = await getDocCacheFirst(mangaRef);

    chapterCache = chapterCache.filter(c => String(c.num) !== String(num));
    const newMaxChapter = getMaxChapterNum(chapterCache);

    if (snap.exists()) {
      const data = snap.data();
      const prev = typeof data.chapterCount === "number" ? data.chapterCount : (chapterCache.length + 1);
      const patch = {
        [`chapters.${num}`]: deleteField(),
        chapterCount: Math.max(0, prev - 1),
        updatedAt: Date.now(),
        lastChapter: newMaxChapter || deleteField(),
        lastChapterUpdated: newMaxChapter || deleteField()
      };
      await updateDoc(mangaRef, patch);
    }

    invalidateChapterCache(currentSlug);
    setCache(CACHE.CHAPTER.key + currentSlug, slimChapterForCache(chapterCache));
    const m = allMangaData.find(x => x.slug === currentSlug);
    if (m) {
      m.chapterCount = Math.max(0, (typeof m.chapterCount === "number" ? m.chapterCount : chapterCache.length + 1) - 1);
      m.updatedAt = Date.now();
      m.lastChapter = newMaxChapter || null;
      m.lastChapterUpdated = newMaxChapter || null;
      setCache(CACHE.MANGA.key, allMangaData.map(slimMangaForCache));
      upsertSummaryEntry(m).catch(() => {});
    }
    renderChapterList();
    const badge = document.querySelector(".manga-detail-header .badge.chapters");
    if (badge) badge.textContent = chapterCache.length + " Chapter";
  } catch (err) {
    console.error(err);
    alert("❌ Failed to delete chapter: " + err.message);
  }
};

window.openMangaDetail = async function(slug) {
  currentDetailSlug = slug;
  currentSlug = slug;
  editingSlug = slug;
  slugTouched = true;

  showLoading("Loading manga...");
  try {
    if (!allMangaData.length) await loadAllMangaData(false);

    let m = allMangaData.find(x => x.slug === slug) || {};
    try {
      const snap = await getDocCacheFirst(doc(firestore, "manga", slug));
      if (snap.exists()) {
        const fs = snap.data();
        const { chapters: _discardChapters, ...fsLight } = fs;
        const hasRealText = (html) => {
          if (!html) return false;
          const tmp = document.createElement("div");
          tmp.innerHTML = String(html);
          return (tmp.textContent || "").replace(/\u00a0/g, " ").trim().length > 0;
        };
        const keepDesc = hasRealText(fs.desc) ? fs.desc : (hasRealText(m.desc) ? m.desc : "");

      console.warn("Firestore getDoc error:", e);

      const github = await loadGithubManga(false);

        x.slug === slug ||

/* ============================================================
   UPDATE TIMESTAMP HELPERS (manual seperti Blogger)
   ============================================================ */
function toDatetimeLocalValue(ts) {
  if (!ts) return "";
  const d = new Date(typeof ts === "number" ? ts : Number(ts));
  if (isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return (
    d.getFullYear() +
    "-" + pad(d.getMonth() + 1) +
    "-" + pad(d.getDate()) +
    "T" + pad(d.getHours()) +
    ":" + pad(d.getMinutes())
  );
}

function parseUpdateDateInput() {
  const el = document.getElementById("mUpdateDate");
  if (!el || !el.value) return null;
  const d = new Date(el.value);
  if (isNaN(d.getTime())) return null;
  return d.getTime();
}

window.setUpdateDateToNow = function() {
  const el = document.getElementById("mUpdateDate");
  if (!el) return;
  el.value = toDatetimeLocalValue(Date.now());
};

window.updateMangaTimestampOnly = async function() {
  const slug = document.getElementById("mSlug")?.value.trim() || currentDetailSlug || editingSlug;
  if (!slug) return alert("Slug tidak ditemukan!");

  let ts = parseUpdateDateInput();
  if (ts == null) {
    ts = Date.now();
    const el = document.getElementById("mUpdateDate");
    if (el) el.value = toDatetimeLocalValue(ts);
  }

  if (!confirm("Update timestamp ke " + new Date(ts).toLocaleString("id-ID") + "?")) return;

  try {
    showLoading("Updating...");
    const mLocal = allMangaData.find(m => m.slug === slug);
    const patch = {
      updatedAt: ts,
      latestUpdate: ts,
      managedByAdmin: true
    };
   
    if (mLocal && (mLocal.source === "github" || mLocal.origin === "github" || mLocal.githubSlug)) {
      patch.source = "hybrid";
      patch.origin = mLocal.origin || "github";
      patch.githubSlug = mLocal.githubSlug || slug;
      if (!mLocal.title) { /* keep existing */ }
  
      const parentSnap = await getDocCacheFirst(doc(firestore, "manga", slug));
      if (!parentSnap.exists()) {
        patch.title = mLocal.title || slug;
        patch.cover = mLocal.cover || mLocal.img || "";
        patch.desc = mLocal.desc || "";
        patch.type = mLocal.type || "manga";
        patch.status = (mLocal.status || "ongoing").toLowerCase();
        patch.genres = Array.isArray(mLocal.genres) ? mLocal.genres : [];
        patch.chapterCount = typeof mLocal.chapterCount === "number" ? mLocal.chapterCount : 0;
      }
    }

    await setDoc(doc(firestore, "manga", slug), patch, { merge: true });

    const idx = allMangaData.findIndex(m => m.slug === slug);
    if (idx !== -1) {
      allMangaData[idx].updatedAt = ts;
      allMangaData[idx].latestUpdate = ts;
      allMangaData[idx].managedByAdmin = true;
      if (allMangaData[idx].source === "github") {
        allMangaData[idx].source = "hybrid";
        allMangaData[idx].origin = allMangaData[idx].origin || "github";
        allMangaData[idx].githubSlug = allMangaData[idx].githubSlug || slug;
      }
      setCache(CACHE.MANGA.key, allMangaData.map(slimMangaForCache));
      upsertSummaryEntry(allMangaData[idx]).catch(() => {});
    }
    invalidateMangaCache();

    const label = document.getElementById("currentUpdatedAtLabel");
    if (label) label.textContent = new Date(ts).toLocaleString("id-ID");

    alert("✅ Updated!");
  } catch (err) {
    console.error(err);
    alert("❌ " + err.message);
  } finally {
    hideLoading();
  }
};

window.saveMangaFromDetail = async function(goToDetail = false) {

  if (!slug) return alert("Slug is required!");
  const ratingRaw = document.getElementById("mRating")?.value.trim() || "";
  const rating = parseFloat(ratingRaw);
  const existing = allMangaData.find(
    m => m.slug === (editingSlug || slug)

  let origin = "firestore";

  if (existing) {
    if (
      existing.origin === "github" ||
      existing.source === "github" ||
      existing.githubSlug ||
      (existing.source === "hybrid" && existing.githubSlug)
    ) {
      origin = "github";
    } else if (
      existing.origin === "firestore" ||
      existing.source === "firestore"
    ) {
      origin = "firestore";
    } else if (existing.source === "hybrid") {
      origin = "firestore";
    }
  }

  const data = {
    title: document.getElementById("mTitle")?.value.trim() || "",
    altTitle: document.getElementById("mAltTitle")?.value.trim() || "",
    cover: document.getElementById("mCover")?.value.trim() || "",
    desc: quill ? quill.root.innerHTML.trim() : "",
    type: document.getElementById("mType")?.value || "manga",

    characters: (document.getElementById("mCharacters")?.value || "")
      .split(",")

    status: (document.getElementById("mStatus")?.value || "ongoing")

      .toLowerCase(),

    publication: document.getElementById("mPublication")?.value.trim() || "",
    serialization: document.getElementById("mSerialization")?.value.trim() || "",
    author: document.getElementById("mAuthor")?.value.trim() || "",
    artist: document.getElementById("mArtist")?.value.trim() || "",
    circle: document.getElementById("mCircle")?.value.trim() || "",
    group: document.getElementById("mGroup")?.value.trim() || "",

    genres: (document.getElementById("mGenres")?.value || "")
      .split(",")
      .map(g => g.trim())
      .filter(Boolean),

    femaleTags: (document.getElementById("mFemaleTags")?.value || "")
      .split(",")
      .map(v => v.trim())
      .filter(Boolean),

    maleTags: (document.getElementById("mMaleTags")?.value || "")
      .split(",")
      .map(v => v.trim())
      .filter(Boolean),

    tags: (document.getElementById("mTags")?.value || "")
      .split(",")
      .map(v => v.trim())
      .filter(Boolean),

    rating: isNaN(rating)
      ? 0
      : Math.max(0, Math.min(10, rating)),

    isDraft: document.getElementById("mDraft")?.checked || false,

    managedByAdmin: true,
    origin: origin,
    source: origin === "github" ? "hybrid" : "firestore"
  };

  try {
    showLoading("Saving...");

    const newRef = doc(firestore, "manga", slug);
    const lookupSlug = editingSlug || slug;
    const oldRef = doc(firestore, "manga", lookupSlug);
    const oldSnap = await getDocCacheFirst(oldRef);

    if (oldSnap.exists()) {
      const oldData = oldSnap.data();

      data.chapterCount =
        typeof oldData.chapterCount === "number"
          ? oldData.chapterCount
          : (oldData.chapters && typeof oldData.chapters === "object"
            ? Object.keys(oldData.chapters).length
            : 0);

      const manualTs = parseUpdateDateInput();
      if (manualTs != null) {
        data.updatedAt = manualTs;
        data.latestUpdate = manualTs;
      } else {
        if (oldData.updatedAt != null) data.updatedAt = oldData.updatedAt;
        if (oldData.latestUpdate != null) data.latestUpdate = oldData.latestUpdate;
      }

      if (oldData.lastChapterUpdated != null) {
        data.lastChapterUpdated = oldData.lastChapterUpdated;
      }

      if (oldData.lastChapter != null) {
        data.lastChapter = oldData.lastChapter;
      }

      if (oldData.origin) {
        data.origin = oldData.origin;
      }

      if (oldData.githubSlug) {
        data.githubSlug = oldData.githubSlug;
      }

    } else {
      data.chapterCount = 0;
      const manualTs = parseUpdateDateInput();
      if (manualTs != null) {
        data.updatedAt = manualTs;
        data.latestUpdate = manualTs;
      }
    }

    if (oldSnap.exists() && oldSnap.data().githubSlug) {
      data.githubSlug = oldSnap.data().githubSlug;
    } else if (origin === "github") {
      data.githubSlug = slug;

    delete data.chapters;

    await setDoc(
      newRef,
      data,
      { merge: true }
    );

    if (
      editingSlug &&
      editingSlug !== slug &&
      oldSnap.exists()
    ) {
      await deleteDoc(oldRef);
      await removeSummaryEntry(editingSlug);
    }

    invalidateMangaCache();

    const oldIndex = allMangaData.findIndex(
      m =>
        m.slug === slug ||
        (editingSlug && m.slug === editingSlug)
    );

    const updatedManga = {
      ...data,

      allMangaData[oldIndex] = updatedManga;

      allMangaData.push(updatedManga);
    }

      slug: m.slug,
      title: m.title || m.slug

      CACHE.MANGA.key,
      allMangaData.map(slimMangaForCache)
    );

      CACHE.LIGHT.key,
      lightMangaList

    openMangaDetail(slug);

  } catch (err) {
    console.error(err);

    );

  }
};

window.deleteManga = async (slug) => {
  if (!confirm(`Delete manga "${slug}" and all its chapters?`)) return;
  try {
    showLoading("Deleting...");
    const chapSnap = await getDocs(query(collection(firestore, "manga", slug, "chapters"), limit(500)));
    let batch = writeBatch(firestore);
    let ops = 0;
    for (const d of chapSnap.docs) {
      batch.delete(d.ref);
      ops++;
      if (ops >= 450) {
        await batch.commit();
        batch = writeBatch(firestore);
        ops = 0;
      }
    }
    if (ops > 0) await batch.commit();
    await deleteDoc(doc(firestore, "manga", slug));
    await removeSummaryEntry(slug);

    allMangaData = allMangaData.filter(m => m.slug !== slug);
    lightMangaList = lightMangaList.filter(m => m.slug !== slug);
    setCache(CACHE.MANGA.key, allMangaData.map(slimMangaForCache));
    setCache(CACHE.LIGHT.key, lightMangaList);
    invalidateChapterCache(slug);
    invalidateMangaCache();

    alert("✅ Manga deleted!");
    showSection("manga-list");
  } catch (e) {
    alert("Failed to delete: " + e.message);
  } finally {
    hideLoading();
  }
};

      if (conflict.exists() && !confirm(`Chapter ${newNum} already exists. Overwrite?`)) {

      }

    let nextOrder = 1;
    const sourceNum = oldNum || newNum;
    const existingChap = await getDocCacheFirst(doc(firestore, "manga", slug, "chapters", sourceNum));
    if (existingChap.exists() && existingChap.data().order != null) {
      nextOrder = existingChap.data().order;

      const cachedManga = allMangaData.find(m => m.slug === slug);
      nextOrder = (cachedManga?.chapterCount || chapterCache.length || 0) + 1;

    const chapterData = {
  title: customTitle || "Chapter " + newNum,

  images: uniqueImages,
  content: chapterQuill ? chapterQuill.root.innerHTML : "",
  date: existingChap.exists()

function parseChapterNum(val) {
  if (val == null || val === "") return 0;
  const n = parseFloat(String(val).replace(/[^\d.]/g, ""));
  return isNaN(n) ? 0 : n;
}

function getMaxChapterNum(list, extra) {
  let maxNum = -1;
  let maxStr = "";
  let found = false;

  const consider = (raw) => {
    if (raw == null || raw === "") return;
    const str = String(raw).trim();
    if (str === "") return;
    const n = parseChapterNum(str);
    if (isNaN(n) || n < 0) return;
    if (!found || n > maxNum) {
      maxNum = n;
      maxStr = str;
      found = true;
    }
  };

  if (Array.isArray(list)) {
    list.forEach((item) => {
      if (item == null) return;
      if (typeof item === "object") consider(item.num);
      else consider(item);
    });
  }
  if (extra != null) consider(extra);

  return found ? maxStr : "";
}

function getImageFileName(url) {
  try {
    const clean = String(url || "").split("?")[0].split("#")[0];
    const name = clean.split("/").pop() || "";
    return decodeURIComponent(name) || name;
  } catch {
    return String(url || "").split("/").pop() || "";
  }
}

function naturalCompare(a, b) {
  const ax = [], bx = [];
  String(a).replace(/(\d+)|(\D+)/g, (_, n, t) => ax.push([n || Infinity, n ? +n : t.toLowerCase()]));
  String(b).replace(/(\d+)|(\D+)/g, (_, n, t) => bx.push([n || Infinity, n ? +n : t.toLowerCase()]));
  while (ax.length && bx.length) {
    const an = ax.shift(), bn = bx.shift();
    if (an[0] !== bn[0]) return an[0] - bn[0];
    if (an[1] < bn[1]) return -1;
    if (an[1] > bn[1]) return 1;
  }
  return ax.length - bx.length;
}

window.sortImageListByName = function(silent = false) {
  if (!currentImageList.length) {
    if (!silent) alert("Tidak ada gambar untuk diurutkan.");
    return;
  }
  currentImageList = [...currentImageList].sort((a, b) =>
    naturalCompare(getImageFileName(a), getImageFileName(b))
  );
  renderImageList();

function enableImageListDrag(container) {
  let dragFrom = null;
  let touchFrom = null;
  let isDragging = false;
  let longPressTimer = null;
  let activeItem = null;
  let startX = 0;
  let startY = 0;
  const MOVE_CANCEL_PX = 12;
  const LONG_PRESS_MS = 420; 

  const clearDragOver = () => {
    container.querySelectorAll(".image-item.drag-over, .image-item.dragging")
      .forEach(el => el.classList.remove("drag-over", "dragging"));
  };

  const resetTouch = () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    clearDragOver();
    touchFrom = null;
    isDragging = false;
    activeItem = null;
  };

  const reorder = (from, to) => {
    if (from === to || from < 0 || to < 0) return;
    if (from >= currentImageList.length || to >= currentImageList.length) return;
    const moved = currentImageList.splice(from, 1)[0];
    currentImageList.splice(to, 0, moved);
    renderImageList();
  };

  const itemFromPoint = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el?.closest?.(".image-item") || null;
  };

  container.querySelectorAll(".image-item").forEach(item => {
    item.addEventListener("contextmenu", e => e.preventDefault());
    item.querySelector("img")?.addEventListener("contextmenu", e => e.preventDefault());

    // ----- Desktop HTML5 DnD -----
    item.addEventListener("dragstart", e => {
      if (e.target.closest(".img-actions")) {
        e.preventDefault();
        return;
      }
      dragFrom = Number(item.dataset.index);
      item.classList.add("dragging");
      try {
        e.dataTransfer.setData("text/plain", String(dragFrom));
        e.dataTransfer.effectAllowed = "move";
      } catch (_) {}
    });

    item.addEventListener("dragend", () => {
      clearDragOver();
      dragFrom = null;
    });

    item.addEventListener("dragover", e => {
      e.preventDefault();
      try { e.dataTransfer.dropEffect = "move"; } catch (_) {}
      container.querySelectorAll(".image-item.drag-over").forEach(el => {
        if (el !== item) el.classList.remove("drag-over");
      });
      item.classList.add("drag-over");
    });

    item.addEventListener("dragleave", () => item.classList.remove("drag-over"));

    item.addEventListener("drop", e => {
      e.preventDefault();
      e.stopPropagation();
      const from = dragFrom != null
        ? dragFrom
        : parseInt(e.dataTransfer.getData("text/plain"), 10);
      const to = Number(item.dataset.index);
      clearDragOver();
      reorder(from, to);
      dragFrom = null;
    });

    item.addEventListener("touchstart", e => {
      if (e.target.closest(".img-actions")) return;
      const touch = e.touches[0];
      touchFrom = Number(item.dataset.index);
      isDragging = false;
      activeItem = item;
      startX = touch.clientX;
      startY = touch.clientY;

      longPressTimer = setTimeout(() => {
        if (!activeItem || touchFrom == null) return;
        isDragging = true;
        activeItem.classList.add("dragging");
        try { navigator.vibrate?.(12); } catch (_) {}
      }, LONG_PRESS_MS);
    }, { passive: true });

    item.addEventListener("touchmove", e => {
      if (touchFrom == null) return;
      const touch = e.touches[0];
      const dx = Math.abs(touch.clientX - startX);
      const dy = Math.abs(touch.clientY - startY);

      if (!isDragging) {
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX) {
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          touchFrom = null;
          activeItem = null;
        }
        return;
      }

      e.preventDefault();
      const over = itemFromPoint(touch.clientX, touch.clientY);
      container.querySelectorAll(".image-item.drag-over").forEach(el => {
        if (el !== over) el.classList.remove("drag-over");
      });
      if (over && over !== activeItem) over.classList.add("drag-over");
    }, { passive: false });

    item.addEventListener("touchend", e => {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      if (touchFrom == null) return;

      if (isDragging) {
        const touch = e.changedTouches[0];
        const over = itemFromPoint(touch.clientX, touch.clientY);
        const to = over ? Number(over.dataset.index) : -1;
        const from = touchFrom;
        resetTouch();
        if (to >= 0) reorder(from, to);
        return;
      }

      touchFrom = null;
      activeItem = null;
      isDragging = false;
    }, { passive: true });

    item.addEventListener("touchcancel", () => resetTouch());
  });
}

window.copyImageLink = async function(index, btn) {
  const url = currentImageList[index];
  if (!url) return;
  try { await navigator.clipboard.writeText(url); } catch {
    prompt("Copy link ini:", url);
    return;
  }
  if (!btn) return;
  const old = btn.innerHTML;
  btn.innerHTML = "✅";
  btn.disabled = true;
  setTimeout(() => { btn.innerHTML = old; btn.disabled = false; }, 1200);
};

window.removeImage = function(index) {
  currentImageList.splice(index, 1);
  renderImageList();
};

window.loadModerationReports = async function() {
  const tbody = document.getElementById("modReportTable");
  const status = document.getElementById("modStatus");
  if (!tbody) return;
  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;">Loading...</td></tr>`;

  try {
    const snap = await getDocs(
      query(
        collection(firestore, "chapterReports"),
        where("status", "==", "pending"),
        limit(100)
      )
    );

    tbody.innerHTML = "";
    const reports = [];
    snap.forEach(docSnap => reports.push({ id: docSnap.id, ...docSnap.data() }));
    reports.sort((a, b) => {
      const ta = a.createdAt?.seconds || a.createdAt || 0;
      const tb = b.createdAt?.seconds || b.createdAt || 0;
      return tb - ta;
    });

    if (!reports.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;">No reports</td></tr>`;
      if (status) status.textContent = "No pending reports";
      return;
    }

    reports.forEach(r => {
      const created = r.createdAt?.seconds
        ? new Date(r.createdAt.seconds * 1000)
        : new Date(r.createdAt || Date.now());
      const row = document.createElement("tr");
      row.innerHTML = `
        <td style="padding:12px;">${created.toLocaleString("id-ID")}</td>
        <td style="padding:12px;">${r.slug || "-"}</td>
        <td style="padding:12px;">${r.chapter || "-"}</td>
        <td style="padding:12px;">${r.type || "-"}</td>
        <td style="padding:12px;max-width:280px;">${r.reason || "-"}</td>
        <td style="padding:12px;">${r.url ? `<a href="${r.url}" target="_blank">🔗 Buka</a>` : "-"}</td>
        <td style="padding:12px;text-align:center;">
          <button onclick="resolveChapterReport('${r.id}')" class="btn-success btn-small">Mark Resolved</button>
        </td>`;
      tbody.appendChild(row);
    });
    if (status) status.textContent = `✅ ${reports.length} reports found`;
  } catch (err) {
    console.error(err);
    if (status) status.textContent = "❌ " + err.message;
  }
};

window.resolveChapterReport = async function(reportId) {
  if (!confirm("Mark this report as resolved?")) return;
  try {
    await updateDoc(doc(firestore, "chapterReports", reportId), {
      status: "resolved",
      resolvedAt: Date.now(),
      resolvedBy: auth.currentUser?.email || "admin"
    });
    alert("✅ Report resolved");
    loadModerationReports();
  } catch (err) {
    alert("❌ " + err.message);
  }
};

window.rebuildSummaryFromServer = async function() {
  const status = document.getElementById("summaryStatus");
  if (status) status.textContent = "Rebuilding summary...";
  try {
    showLoading("Rebuilding mangaSummary...");
    invalidateMangaCache();
    await loadAllMangaData(true);
    await rebuildMangaSummary(allMangaData);
    if (status) status.innerHTML = `✅ Summary rebuilt · ${allMangaData.length} manga`;
  } catch (e) {
    console.error(e);
    if (status) status.textContent = "❌ " + e.message;
  } finally {
    hideLoading();
  }
};

function downloadJson(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

window.backupFirestore = async function(includeChapters = false) {
  const status = document.getElementById("backupStatus");
  if (status) status.textContent = "Loading manga...";

  try {
    showLoading(includeChapters ? "Backing up manga + chapters..." : "Backing up manga...");

    const snap = await getDocs(collection(firestore, "manga"));
    const mangaList = [];
    let chapterTotal = 0;

    for (const docSnap of snap.docs) {
      const item = { id: docSnap.id, ...docSnap.data() };

      if (includeChapters) {
        if (status) status.textContent = `Loading chapters: ${docSnap.id}...`;
        const chapSnap = await getDocs(collection(firestore, "manga", docSnap.id, "chapters"));
        const chapters = {};
        chapSnap.forEach(c => {
          chapters[c.id] = c.data();
        });
        item._chapters = chapters;
        chapterTotal += chapSnap.size;
      }

      mangaList.push(item);
    }

    const payload = {
      exportedAt: new Date().toISOString(),
      exportedAtMs: Date.now(),
      includeChapters: !!includeChapters,
      mangaCount: mangaList.length,
      chapterCount: includeChapters ? chapterTotal : undefined,
      manga: mangaList
    };

    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    const name = includeChapters
      ? `mikoroku-backup-full-${stamp}.json`
      : `mikoroku-backup-manga-${stamp}.json`;

    downloadJson(name, payload);

    if (status) {
      status.innerHTML = includeChapters
        ? `✅ Downloaded <b>${mangaList.length}</b> manga + <b>${chapterTotal}</b> chapters`
        : `✅ Downloaded <b>${mangaList.length}</b> manga`;
    }
  } catch (err) {
    console.error(err);
    if (status) status.textContent = "❌ " + err.message;
    alert("❌ Backup failed:\n" + err.message);
  } finally {
    hideLoading();
  }
};

/* ============================================================
   QUILL
   ============================================================ */
function ensureQuill() {
  if (document.getElementById("editor") && !quill) {
    quill = new Quill("#editor", {
      theme: "snow",
      placeholder: "Write manga description...",
      modules: {
        toolbar: [
          ["bold", "italic", "underline"],
          [{ list: "ordered" }, { list: "bullet" }],
          ["link"],
          ["clean"]
        ]
      }
    });
  } else if (document.getElementById("editor") && quill) {
    try {
      const existing = document.querySelector("#editor .ql-editor");
      if (!existing) {
        quill = null;
        ensureQuill();
      }
    } catch {
      quill = null;
      ensureQuill();
    }
  }
  return quill;
}

function ensureChapterQuill() {
  if (document.getElementById("chapterEditor") && !chapterQuill) {
    chapterQuill = new Quill("#chapterEditor", {
      theme: "snow",
      placeholder: "Novel chapter content (optional)...",
      modules: {
        toolbar: [
          ["bold", "italic", "underline"],
          [{ size: ["small", false, "large", "huge"] }],
          [{ header: [1, 2, 3, false] }],
          [{ align: [] }],
          ["clean"]
        ]
      }
    });
  } else if (document.getElementById("chapterEditor")) {
    try {
      if (!document.querySelector("#chapterEditor .ql-editor")) {
        chapterQuill = null;
        ensureChapterQuill();
      }
    } catch {
      chapterQuill = null;
      ensureChapterQuill();
    }
  }
  return chapterQuill;
}
